<title>東京・湘南旅行帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a train line. Sticky search bar + line map of chapter "stations"; each chapter opens with a station-name sign. */
:root{
  --paper:#F3F5F2; --card:#FFFFFF; --ink:#1A1F2B; --muted:#5A6371; --rule:#D6DBD5;
  --torii:#C3352B; --line:#2E9A4E; --hl:#FFE27A; --zebra:#F7F8F6;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-label:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11141A; --card:#181C24; --ink:#E6E9ED; --muted:#9BA3AE; --rule:#2B313B;
  --torii:#FF6E60; --line:#4CC46F; --hl:#6A5A14; --zebra:#1C2029; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141A; --card:#181C24; --ink:#E6E9ED; --muted:#9BA3AE; --rule:#2B313B;
  --torii:#FF6E60; --line:#4CC46F; --hl:#6A5A14; --zebra:#1C2029; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font:400 16px/1.75 var(--f-body);
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
a{color:var(--line);text-underline-offset:3px}
a:focus-visible,summary:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--torii);outline-offset:2px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px 0}
.bar-row{display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:15px;letter-spacing:.04em;white-space:nowrap}
.brand span{color:var(--torii)}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;box-sizing:border-box;font:500 15px var(--f-body);color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:999px;padding:7px 36px 7px 14px}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);
  font-size:18px;width:30px;height:30px;cursor:pointer}
.hits{font:600 12px var(--f-label);color:var(--muted);letter-spacing:.04em;min-height:0}
.linemap{display:flex;overflow-x:auto;scrollbar-width:none;position:relative;padding-bottom:8px;gap:0}
.linemap::-webkit-scrollbar{display:none}
.stop{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);
  min-width:64px;position:relative;padding-top:2px}
.stop::before{content:"";position:absolute;top:13px;left:0;right:0;height:4px;background:var(--line)}
.stop:first-child::before{left:50%}.stop:last-child::before{right:50%}
.stop .code{position:relative;z-index:1;font:700 10px/1 var(--f-label);letter-spacing:.02em;background:var(--card);
  border:3px solid var(--line);border-radius:7px;padding:4px 4px 3px;color:var(--ink)}
.stop .nm{font-size:12px;font-weight:500;white-space:nowrap}
.stop.here .code{background:var(--line);color:var(--card)}
.stop.here .nm{font-weight:900}

/* Hero ticket */
.hero{padding-block:24px 8px}
.ticket{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.ticket-top{padding:18px 18px 14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.ticket h1{margin:0;font-weight:900;font-size:clamp(26px,7vw,40px);line-height:1.2;text-wrap:balance}
.ticket h1 small{display:block;font:600 13px var(--f-label);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.count{font:700 14px var(--f-label);color:var(--torii);letter-spacing:.04em}
.legs{display:grid;grid-template-columns:1fr 1fr;border-top:1px dashed var(--rule)}
.leg{padding:12px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.leg+.leg{border-left:1px dashed var(--rule)}
.leg .k{font:600 11px var(--f-label);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.leg .t{font:700 20px var(--f-label);font-variant-numeric:tabular-nums}
.leg .d{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:12px 2px 0}
.note .warn{margin:0 2px}

/* Chapter sign */
.chapter{padding-block:28px 8px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 112px)}
.sign{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:14px}
.sign-top{display:flex;align-items:center;gap:14px;padding:14px 16px 10px}
.num{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:48px;box-sizing:border-box;
  border:4px solid var(--line);border-radius:10px;font:700 11px/1 var(--f-label);letter-spacing:.04em}
.num b{font-size:19px;line-height:1}
.sign-name{min-width:0}
.sign h2{margin:0;font-weight:900;font-size:clamp(21px,5.6vw,28px);line-height:1.25;text-wrap:balance}
.romaji{margin:2px 0 0;font:600 13px var(--f-label);letter-spacing:.12em;color:var(--muted)}
.sign-line{height:8px;background:var(--line)}
.sign-adj{display:flex;justify-content:space-between;padding:6px 16px;font:600 13px var(--f-label);letter-spacing:.03em}
.sign-adj a{color:var(--muted);text-decoration:none}

/* Sub-sections */
.sub{border-bottom:1px solid var(--rule)}
.sub>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 0}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary::before{content:"";flex:0 0 auto;width:8px;height:8px;border-right:2px solid var(--torii);border-bottom:2px solid var(--torii);
  transform:rotate(-45deg);transition:transform .15s}
.sub[open]>summary::before{transform:rotate(45deg)}
.sub>summary h3{margin:0;font-size:18px;font-weight:700;line-height:1.4;text-wrap:balance}
.subbody{padding-bottom:12px}
.chbody>blockquote:first-child{margin-top:0}
.chbody h3{font-size:16.5px;font-weight:700;margin:20px 0 6px}
.chbody p,.chbody li{max-width:68ch}
.chbody ul,.chbody ol{padding-left:1.3em}
.chbody li{margin:3px 0}
.chbody strong{font-weight:700}
.chbody hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
blockquote{margin:12px 0;padding:10px 14px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--torii);border-radius:6px;font-size:15px}
blockquote p{margin:4px 0}
pre{overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px;font-size:12px;line-height:1.5}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
th{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;background:var(--zebra)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:500;min-width:5.5em}
tbody tr:nth-child(even){background:var(--zebra)}

.warn{display:inline-block;font:700 11px/1 var(--f-label);letter-spacing:.06em;color:var(--torii);border:1.5px solid var(--torii);
  border-radius:4px;padding:2px 4px 1px;vertical-align:2px;white-space:nowrap}
li.chk{list-style:none;margin-left:-1.3em}
li.chk input{width:18px;height:18px;vertical-align:-3px;margin-right:6px;accent-color:var(--line)}

::highlight(q){background:var(--hl);color:var(--ink)}
.hidden-by-search{display:none}

footer{padding-block:32px calc(40px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px}
.top{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:700px){html{scroll-behavior:smooth}}
</style>

<div class="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="brand">東京<span>・</span>湘南旅行帖</div>
      <div class="search">
        <input id="q" type="search" placeholder="搜尋：福袋、吻仔魚、Skyliner…" autocomplete="off" aria-label="搜尋攻略">
        <button id="qclear" type="button" aria-label="清除搜尋" hidden>×</button>
      </div>
    </div>
    <div class="hits" id="hits" hidden></div>
    <nav class="linemap" id="linemap" aria-label="章節">
{{NAV}}
    </nav>
  </div>
</div>

<main class="wrap">
  <section class="hero">
    <div class="ticket">
      <div class="ticket-top">
        <h1><small>Tokyo · Kamakura · Enoshima</small>東京・鎌倉・江之島 9 日</h1>
        <span class="count" id="count">2026/12/25 – 2027/1/2</span>
      </div>
      <div class="legs">
        <div class="leg"><span class="k">去程 JX804</span><span class="t">15:00 → 19:00</span><span class="d">12/25（五）桃園 T1 → 成田 T2</span></div>
        <div class="leg"><span class="k">回程 JX805</span><span class="t">20:10 → 23:20</span><span class="d">1/2（六）成田 T2 → 桃園 T1</span></div>
      </div>
    </div>
    <p class="note">整理日期 2026/10/31。標 <span class="warn">確認</span> 的是年末年始可能變動的資訊，出發前一週再查一次官網。上方路線圖可以跳到各章，每段標題點一下可收合。</p>
  </section>

{{CHAPTERS}}

  <footer>內容綜合中、日、英文社群與官方資訊整理；價格與時間以各官網為準。</footer>
</main>
<button class="top" id="top" type="button" aria-label="回到頂端">↑</button>

<script>
(function(){
  // Countdown / trip-day label
  var start=new Date("2026-12-25T15:00:00+08:00"), end=new Date("2027-01-02T23:20:00+08:00"), now=new Date();
  var c=document.getElementById("count");
  if(now<start){c.textContent="距離出發還有 "+Math.ceil((start-now)/864e5)+" 天";}
  else if(now<=end){c.textContent="旅行第 "+(Math.floor((now-start)/864e5)+1)+" 天";}
  else{c.textContent="2026/12/25 – 2027/1/2";}

  // Checklist persistence
  document.querySelectorAll('li.chk input').forEach(function(b){
    try{b.checked=localStorage.getItem(b.id)==="1";}catch(e){}
    b.addEventListener("change",function(){try{localStorage.setItem(b.id,b.checked?"1":"0");}catch(e){}});
  });

  // Current chapter on the line map
  var stops=[].slice.call(document.querySelectorAll(".stop")), map=document.getElementById("linemap");
  var chapters=[].slice.call(document.querySelectorAll(".chapter"));
  function mark(id){
    stops.forEach(function(s){
      var on=s.getAttribute("href")==="#"+id; s.classList.toggle("here",on);
      if(on){map.scrollTo({left:s.offsetLeft-map.clientWidth/2+s.clientWidth/2,behavior:"smooth"});}
    });
  }
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)mark(e.target.id);});},
      {rootMargin:"-30% 0px -65% 0px"});
    chapters.forEach(function(ch){io.observe(ch);});
  }

  // Search
  var q=document.getElementById("q"), clr=document.getElementById("qclear"), hits=document.getElementById("hits");
  var subs=[].slice.call(document.querySelectorAll("details.sub"));
  var hasHL=window.CSS&&CSS.highlights&&window.Highlight;
  function highlight(term){
    if(!hasHL)return; CSS.highlights.delete("q"); if(!term)return;
    var ranges=[], lower=term.toLowerCase();
    document.querySelectorAll(".chbody").forEach(function(root){
      var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), n;
      while((n=w.nextNode())){
        if(n.parentElement.closest(".hidden-by-search"))continue;
        var t=n.data.toLowerCase(), i=t.indexOf(lower);
        while(i>-1){var r=new Range();r.setStart(n,i);r.setEnd(n,i+term.length);ranges.push(r);i=t.indexOf(lower,i+term.length);}
      }
    });
    CSS.highlights.set("q",new Highlight(...ranges));
  }
  function run(){
    var term=q.value.trim(), lower=term.toLowerCase(), count=0;
    clr.hidden=!term;
    subs.forEach(function(d){
      var ok=!term||d.textContent.toLowerCase().indexOf(lower)>-1;
      d.classList.toggle("hidden-by-search",!ok);
      if(term&&ok){d.open=true;count++;}
    });
    chapters.forEach(function(ch){
      var intro=ch.querySelector(".chbody").textContent.toLowerCase().indexOf(lower)>-1;
      var any=ch.querySelector("details.sub:not(.hidden-by-search)");
      ch.classList.toggle("hidden-by-search",!!term&&!any&&!intro);
    });
    hits.hidden=!term;
    hits.textContent=term?(count?"找到 "+count+" 段符合「"+term+"」":"沒有符合「"+term+"」的段落，換個關鍵字試試"):"";
    highlight(term);
  }
  var timer; q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(run,150);});
  clr.addEventListener("click",function(){q.value="";run();q.focus();});
  document.getElementById("top").addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});});
})();
</script>
