<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f6">
<title>澀谷散步日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="itinerary.js"></script>
<style>
:root{
  --ink:#1b2a3a; --ink2:#4a5b6d; --muted:#7d8b99;
  --snow:#f4f6f9; --paper:#ffffff; --ice:#dfe8f1; --line:#d5dee8;
  --navy:#24476b; --accent:#c8553d; --accent-soft:#f6e3de;
  --p-morning:#d9a441; --p-noon:#e07b39; --p-afternoon:#3f8a8c; --p-dusk:#c8553d; --p-night:#3d4f8a;
  --radius:18px; --shadow:0 10px 30px rgba(27,42,58,.18);
  --font:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--snow);color:var(--ink);font-family:var(--font)}
body{overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

/* ---------- layout ---------- */
#app{min-height:100vh}
#player{position:relative;height:calc(100vh - 64px);height:calc(100svh - 64px);min-height:560px;overflow:hidden;background:#e9eef3;user-select:none;-webkit-user-select:none}
#map{position:absolute;inset:0;background:#e9eef3}
#list{padding:22px 16px calc(40px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
@media (min-width:900px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:100vh}
  #player{height:100vh;min-height:0}
  #list{height:100vh;overflow-y:auto;margin:0;max-width:none;border-left:1px solid var(--line);background:var(--snow)}
}

/* winter-toned map */
.leaflet-container{font-family:var(--font);background:#e9eef3}
.leaflet-tile-pane{filter:saturate(.38) brightness(1.06) contrast(.92)}
.map-tint{position:absolute;inset:0;pointer-events:none;z-index:401;
  background:linear-gradient(180deg,rgba(236,242,248,.55) 0%,rgba(236,242,248,0) 22%,rgba(236,242,248,0) 70%,rgba(236,242,248,.45) 100%)}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.7)!important}

/* markers */
.mk{position:relative;width:34px;height:34px;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.mk .dot{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;
  background:#fff;color:var(--navy);border:3px solid var(--navy);box-shadow:0 3px 8px rgba(27,42,58,.3)}
.mk.hidden{transform:scale(0);opacity:0}
.mk.visited .dot{background:var(--accent);border-color:#fff;color:#fff}
.mk.active{transform:scale(1.3);z-index:5}
.mk.active .dot{background:var(--accent);border-color:#fff;color:#fff}
.mk.active::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--accent);opacity:.6;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.7);opacity:.8}to{transform:scale(1.5);opacity:0}}
.mk .lbl{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;
  background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:5px 10px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.mk.active .lbl{opacity:1}
.leaflet-marker-icon.mk-wrap{background:none;border:0}

/* ---------- overlays ---------- */
.overlay{position:absolute;z-index:500;pointer-events:none;transition:opacity .6s ease,transform .6s ease}
#intro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at 50% 45%,rgba(244,246,249,.92) 0%,rgba(244,246,249,.78) 55%,rgba(220,230,240,.55) 100%)}
#intro .kicker{font-size:15px;letter-spacing:.35em;color:var(--ink2);font-weight:500;margin-bottom:10px}
#intro h1{margin:0;font-size:clamp(46px,13vw,76px);font-weight:900;letter-spacing:.06em;line-height:1.1;color:var(--ink)}
#intro .date{margin-top:14px;font-size:clamp(24px,7vw,34px);font-weight:700;color:var(--accent);letter-spacing:.04em}
#intro .sub{margin-top:14px;font-size:15px;color:var(--ink2)}
#intro.off{opacity:0;transform:scale(1.04)}
.snow{position:absolute;inset:0;overflow:hidden}
.snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(120,150,180,.5);animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh)}}

#recap{left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));margin:0 auto;max-width:520px;
  background:rgba(255,255,255,.94);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px}
#recap h3{margin:0 0 8px;font-size:15px;color:var(--ink2);font-weight:700;letter-spacing:.1em}
#recap ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 4px;font-size:16px;font-weight:700;line-height:1.5}
#recap li{display:flex;align-items:center;gap:5px;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
#recap li b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px}
#recap li:not(:last-child)::after{content:"→";color:var(--muted);font-weight:400;margin-left:2px}
#recap.on li{opacity:1;transform:none}
#recap.off{opacity:0;transform:translateY(-12px)}

/* playback card */
#card{left:12px;right:12px;margin:0 auto;max-width:440px;bottom:calc(var(--ctrl-h,124px) + 12px);pointer-events:auto;cursor:pointer;
  background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .4s}
#card.off{transform:translateY(calc(100% + 140px));opacity:0;pointer-events:none}
#card .ph{position:relative;aspect-ratio:16/9;background:var(--ice)}
#card .ph img{width:100%;height:100%;object-fit:cover;display:block}
#card .body{padding:12px 16px 14px}
#card .row{display:flex;align-items:center;gap:10px}
#card h2{margin:0;font-size:26px;font-weight:900;line-height:1.2}
#card .en{font-size:13px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
#card .hl{margin:8px 0 0;font-size:18px;line-height:1.45;font-weight:500;color:var(--ink)}
.num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:17px}
.ph .num{position:absolute;left:12px;top:12px;width:40px;height:40px;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid #fff}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;padding:4px 11px;border-radius:999px;background:var(--navy);white-space:nowrap}
.chip .t{font-weight:500;opacity:.95}
.ph .chip{position:absolute;right:12px;top:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:15px}

#flash{left:50%;top:42%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(27,42,58,.62);
  display:grid;place-items:center;opacity:0;transform:scale(.8)}
#flash.show{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
#flash svg{width:38px;height:38px;fill:#fff}

#hint{left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));margin:0 auto;max-width:420px;text-align:center;
  background:var(--ink);color:#fff;font-size:15px;line-height:1.5;padding:10px 14px;border-radius:14px;opacity:0;transform:translateY(-10px)}
#hint.show{opacity:.95;transform:none}

/* ---------- controls ---------- */
#controls{position:absolute;left:0;right:0;bottom:0;z-index:600;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(27,42,58,.08)}
.c-row{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.c-row+.c-row{margin-top:10px}
#playBtn{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 3px 10px rgba(27,42,58,.3)}
#playBtn svg{width:24px;height:24px;fill:#fff}
#bar{position:relative;flex:1;height:44px;cursor:pointer;touch-action:none}
#bar .track{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--line)}
#bar .fill{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--accent)}
#bar .tick{position:absolute;top:50%;width:4px;height:12px;margin:-6px 0 0 -2px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px rgba(27,42,58,.25)}
#bar .thumb{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.25)}
#time{flex:none;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
#dots{flex:1;display:flex;justify-content:space-between;gap:4px}
#dots button{width:38px;height:38px;border-radius:50%;font-weight:900;font-size:16px;background:#fff;color:var(--navy);border:2px solid var(--line);transition:background .2s,color .2s,border-color .2s,transform .2s}
#dots button.done{border-color:var(--accent);color:var(--accent)}
#dots button.on{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.1)}
#replayBtn{flex:none;height:38px;padding:0 12px;border-radius:999px;background:var(--ice);font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:5px}
#replayBtn svg{width:18px;height:18px;fill:var(--navy)}

/* ---------- itinerary list ---------- */
#list h2{margin:0;font-size:24px;font-weight:900}
#list .lsub{color:var(--ink2);font-size:15px;margin:4px 0 16px}
.stop{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;background:var(--paper);border-radius:var(--radius);
  padding:10px;box-shadow:0 2px 10px rgba(27,42,58,.07);transition:transform .15s,box-shadow .2s}
.stop:active{transform:scale(.985)}
.stop.sel{box-shadow:0 0 0 3px var(--accent),0 2px 10px rgba(27,42,58,.07)}
.stop .th{flex:none;position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--ice)}
.stop .th img{width:100%;height:100%;object-fit:cover;display:block}
.stop .th .num{position:absolute;left:6px;top:6px;width:28px;height:28px;font-size:14px;border:2px solid #fff}
.stop .tx{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px}
.stop .nm{font-size:20px;font-weight:900;line-height:1.25}
.stop .hl{font-size:15.5px;color:var(--ink2);line-height:1.45}
.stop .chip{align-self:flex-start;font-size:13px;padding:3px 9px}
.walk{display:flex;align-items:center;gap:8px;margin:0 0 0 46px;padding:8px 0;font-size:14px;color:var(--muted)}
.walk::before{content:"";width:2px;height:22px;background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 7px)}
.credits{margin-top:26px;font-size:12.5px;color:var(--muted);line-height:1.6}
.credits a{color:inherit}

/* ---------- detail sheet ---------- */
#sheet{position:fixed;inset:0;z-index:2000;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
#sheet.open{visibility:visible}
#sheet .bk{position:absolute;inset:0;background:rgba(18,28,40,.5);opacity:0;transition:opacity .3s}
#sheet.open .bk{opacity:1}
#sheet .pn{position:relative;width:100%;max-width:520px;max-height:92vh;max-height:92svh;overflow-y:auto;background:var(--paper);
  border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom)}
#sheet.open .pn{transform:none}
@media (min-width:900px){#sheet{align-items:center}#sheet .pn{border-radius:22px;max-height:90vh}}
#sheet .ph{position:relative;aspect-ratio:4/3;background:var(--ice)}
#sheet .ph img{width:100%;height:100%;object-fit:cover;display:block}
#sheet .close{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:rgba(18,28,40,.6);color:#fff;font-size:24px;line-height:44px;text-align:center}
#sheet .bd{padding:18px 20px 22px}
#sheet h2{margin:0;font-size:30px;font-weight:900;line-height:1.2}
#sheet .en{color:var(--muted);font-size:14px;margin-top:3px}
#sheet .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#sheet .hl{font-size:19px;line-height:1.55;font-weight:500;margin:14px 0 0}
#sheet .wk{font-size:15px;color:var(--ink2);margin-top:10px}
#sheet .note{margin-top:14px;background:#fbf6ea;border-left:4px solid var(--p-morning);border-radius:10px;padding:10px 14px;font-size:16px;line-height:1.6}
#sheet .note b{display:block;font-size:13px;color:var(--ink2);margin-bottom:2px;letter-spacing:.08em}
#sheet .nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;height:58px;border-radius:16px;background:var(--navy);color:#fff;
  font-size:19px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(36,71,107,.35)}
#sheet .nav svg{width:24px;height:24px;fill:#fff}
#sheet .pv{display:flex;gap:10px;margin-top:12px}
#sheet .pv button{flex:1;height:48px;border-radius:14px;background:var(--ice);font-size:16px;font-weight:700;color:var(--navy)}
#sheet .pv button:disabled{opacity:.35}
</style>
</head>
<body>
<div id="app">
  <section id="player" aria-label="路線動畫">
    <div id="map"></div>
    <div class="map-tint"></div>

    <div id="intro" class="overlay">
      <div class="snow" id="snow"></div>
      <div class="kicker">TOKYO · WINTER WALK</div>
      <h1 id="introTitle"></h1>
      <div class="date" id="introDate"></div>
      <div class="sub" id="introSub"></div>
    </div>

    <div id="recap" class="overlay off"><h3>今日回顧</h3><ol id="recapList"></ol></div>

    <div id="card" class="overlay off" role="button" aria-label="這一站">
      <div class="ph"><img alt=""><span class="num"></span><span class="chip"></span></div>
      <div class="body">
        <div class="row"><div><h2></h2><div class="en"></div></div></div>
        <p class="hl"></p>
      </div>
    </div>

    <div id="flash" class="overlay"><svg viewBox="0 0 24 24"></svg></div>
    <div id="hint" class="overlay"></div>

    <div id="controls">
      <div class="c-row">
        <button id="playBtn" aria-label="播放/暫停"><svg viewBox="0 0 24 24"></svg></button>
        <div id="bar" role="slider" aria-label="播放進度" tabindex="0"><div class="track"></div><div class="fill"></div><div id="ticks"></div><div class="thumb"></div></div>
        <div id="time">0:00 / 0:00</div>
      </div>
      <div class="c-row">
        <div id="dots"></div>
        <button id="replayBtn" aria-label="重播"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>重播</button>
      </div>
    </div>
  </section>

  <section id="list">
    <h2>行程表</h2>
    <div class="lsub" id="listSub"></div>
    <div id="stops"></div>
    <div class="credits">地圖 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors・步行路線依 OSM 路網計算・照片來源見 photos/credits.txt（Unsplash License）</div>
  </section>
</div>

<div id="sheet" aria-hidden="true">
  <div class="bk"></div>
  <div class="pn" role="dialog" aria-modal="true">
    <div class="ph"><img alt=""><span class="num"></span><button class="close" aria-label="關閉">✕</button></div>
    <div class="bd">
      <h2></h2><div class="en"></div>
      <div class="meta"></div>
      <p class="hl"></p>
      <div class="wk"></div>
      <div class="note"><b>備註</b><span></span></div>
      <a class="nav" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Google Maps 導航</a>
      <div class="pv"><button class="prev">← 上一站</button><button class="next">下一站 →</button></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const TRIP = window.TRIP, S = TRIP.stops, N = S.length;
const $ = (s, r=document) => r.querySelector(s);

/* ---------- timeline (seconds) ---------- */
const INTRO = 3, OVER = 5, STOP = 6.5, MOVE = 2.4, CARD_IN = 2.5, CARD_OUT = 6.15, OUTRO = 4;
const T0 = INTRO + OVER, TEND = T0 + N * STOP, TOTAL = TEND + OUTRO;
const Z_STOP = 17;

const PERIOD_COLOR = {"早上":"var(--p-morning)","中午":"var(--p-noon)","下午":"var(--p-afternoon)","傍晚":"var(--p-dusk)","晚上":"var(--p-night)"};
const periodColor = p => { for (const k in PERIOD_COLOR) if ((p||"").includes(k)) return PERIOD_COLOR[k]; return "var(--navy)"; };
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- photos: photos/<站名>.jpg first, then photos/auto/<photo>, then placeholder ---------- */
function placeholder(i){
  const s = S[i], c1 = ["#dfe8f1","#e9e3f2","#f2e6dc","#dcefe9","#f3dfdc","#e1e4f4","#efe7d6"][i%7];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs><rect width="640" height="400" fill="url(#g)"/><path d="M0 300 L120 210 L210 270 L330 170 L450 260 L540 200 L640 260 L640 400 L0 400Z" fill="#c9d6e3"/><path d="M0 340 L160 280 L300 330 L460 270 L640 330 L640 400 L0 400Z" fill="#b3c4d5"/><circle cx="520" cy="95" r="38" fill="#fff" opacity=".8"/><text x="320" y="150" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="700" fill="#24476b">${esc(s.name)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
S.forEach((s, i) => { s._src = s.photo ? "photos/auto/" + s.photo : placeholder(i); });
function tryLoad(src){ return new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src; }); }
async function resolvePhoto(i){
  const s = S[i];
  for (const ext of ["jpg","jpeg","png","webp"]) {
    const src = "photos/" + encodeURIComponent(s.name) + "." + ext;
    if (await tryLoad(src)) { s._src = src; s._user = true; break; }
  }
  if (!s._user && !(s.photo && await tryLoad(s._src))) s._src = placeholder(i);
  document.querySelectorAll(`img[data-stop="${i}"]`).forEach(setImg);
}
function setImg(img){
  const i = +img.dataset.stop, s = S[i];
  img.onerror = () => { img.onerror = null; img.src = placeholder(i); };
  if (img.getAttribute("src") !== s._src) img.src = s._src;
  img.style.objectPosition = s.focus || "50% 50%";
}
function bindImg(img, i){ img.dataset.stop = i; setImg(img); }

/* ---------- map ---------- */
// 預設線上載入 OSM 圖磚；若頁面先設定 window.TILES（例如離線打包的圖磚），就改用它
const TILES = window.TILES || { url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", opts:{ maxZoom:19 }, map:{} };
const map = L.map("map", Object.assign({ zoomControl:false, zoomSnap:0, zoomDelta:.5, attributionControl:true, fadeAnimation:true, inertia:true }, TILES.map || {}));
map.attributionControl.setPosition("topright").setPrefix(false);
L.tileLayer(TILES.url, Object.assign({
  attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
}, TILES.opts)).addTo(map);

// legs: legs[i] = path from stop i-1 to stop i (legs[0] empty)
const legs = S.map((s, i) => i === 0 ? [] : (s.path && s.path.length > 1 ? s.path : [S[i-1].coords, s.coords]));
const dist = (a, b) => { const k = Math.cos(a[0]*Math.PI/180); const dx = (b[1]-a[1])*k, dy = b[0]-a[0]; return Math.sqrt(dx*dx+dy*dy); };
const legCum = legs.map(p => { const c = [0]; for (let j = 1; j < p.length; j++) c.push(c[j-1] + dist(p[j-1], p[j])); return c; });
const legLen = legCum.map(c => c[c.length-1] || 0);
const routeLen = legLen.reduce((a, b) => a + b, 0);
const stopAt = []; { let acc = 0; for (let i = 0; i < N; i++) { acc += legLen[i]; stopAt.push(routeLen ? acc/routeLen : i/(N-1||1)); } }

function partial(i, f){
  const p = legs[i], c = legCum[i]; if (!p.length) return [];
  if (f >= 1) return p.slice(); if (f <= 0) return [p[0]];
  const target = f * legLen[i]; const out = [p[0]];
  for (let j = 1; j < p.length; j++) {
    if (c[j] >= target) { const r = (target - c[j-1]) / ((c[j]-c[j-1]) || 1); out.push([p[j-1][0] + (p[j][0]-p[j-1][0])*r, p[j-1][1] + (p[j][1]-p[j-1][1])*r]); break; }
    out.push(p[j]);
  }
  return out;
}
function routeUpTo(i, f){ // legs 1..i-1 full + leg i partial
  let out = [];
  for (let k = 1; k < i; k++) out = out.concat(legs[k]);
  if (i >= 1 && i < N) out = out.concat(partial(i, f));
  return out;
}
function routeFrac(F){ // whole route up to fraction F of total length
  if (F >= 1) return fullRoute;
  const target = F * routeLen; let acc = 0, out = [];
  for (let k = 1; k < N; k++) {
    if (acc + legLen[k] >= target) { out = out.concat(partial(k, (target - acc) / (legLen[k] || 1))); return out; }
    out = out.concat(legs[k]); acc += legLen[k];
  }
  return out;
}
let fullRoute = []; for (let k = 1; k < N; k++) fullRoute = fullRoute.concat(legs[k]);

const baseLine = L.polyline([], { color:"#24476b", weight:5, opacity:.55, dashArray:"1 10", lineCap:"round", interactive:false }).addTo(map);
const casing = L.polyline([], { color:"#ffffff", weight:11, opacity:.95, lineCap:"round", lineJoin:"round", interactive:false }).addTo(map);
const progLine = L.polyline([], { color:"#c8553d", weight:6, opacity:1, lineCap:"round", lineJoin:"round", interactive:false }).addTo(map);

const markers = S.map((s, i) => {
  const icon = L.divIcon({ className:"mk-wrap", iconSize:[34,34], iconAnchor:[17,17],
    html:`<div class="mk hidden"><div class="dot">${i+1}</div><span class="lbl">${esc(s.name)}</span></div>` });
  const m = L.marker(s.coords, { icon, keyboard:false, riseOnHover:true }).addTo(map);
  m.on("click", e => { L.DomEvent.stopPropagation(e); onStopTap(i); });
  return m;
});
const mkState = new Array(N).fill("hidden");
function setMk(i, st){ if (mkState[i] === st) return; mkState[i] = st; const el = markers[i].getElement(); if (!el) return;
  el.firstChild.className = "mk " + st; markers[i].setZIndexOffset(st.includes("active") ? 1000 : 0); }

/* ---------- camera ---------- */
const ctrlEl = $("#controls"), cardEl = $("#card");
let ov = null;           // overview camera {c: world point @z0, z}
function measure(){
  map.invalidateSize({ animate:false });
  const ch = ctrlEl.offsetHeight; document.documentElement.style.setProperty("--ctrl-h", ch + "px");
  const b = L.latLngBounds(S.map(s => s.coords)).pad(0.04);
  const top = Math.min(150, map.getSize().y * .2);
  const r = map._getBoundsCenterZoom(b, { paddingTopLeft:[34, top], paddingBottomRight:[34, ch + 34] });
  ov = { c: map.project(r.center, 0), z: Math.min(r.zoom, 16.5) };
}
function stopCam(i){
  const H = map.getSize().y, occ = ctrlEl.offsetHeight + cardEl.offsetHeight + 24;
  const ty = clamp((H - occ) / 2 + 10, 110, H / 2);  // where the stop should appear on screen
  const z = Z_STOP, p = map.project(S[i].coords, 0);
  return { c: L.point(p.x, p.y + (H/2 - ty) / Math.pow(2, z)), z };
}
function mix(A, B, e){
  const dpx = A.c.distanceTo(B.c) * Math.pow(2, Math.max(A.z, B.z));
  const bump = clamp(dpx / map.getSize().x * .35, 0, 1.4);
  return { c: L.point(A.c.x + (B.c.x - A.c.x)*e, A.c.y + (B.c.y - A.c.y)*e), z: A.z + (B.z - A.z)*e - bump*Math.sin(Math.PI*e) };
}
let lastCam = "";
function apply(cam){
  const key = cam.c.x.toFixed(9) + "," + cam.c.y.toFixed(9) + "," + cam.z.toFixed(4);
  if (key === lastCam) return; lastCam = key;
  map.setView(map.unproject(cam.c, 0), cam.z, { animate:false });
}

/* ---------- overlays & UI ---------- */
$("#introTitle").textContent = TRIP.title; $("#introDate").textContent = TRIP.date; $("#introSub").textContent = TRIP.subtitle || "";
$("#listSub").textContent = `${TRIP.date}・${N} 站・${TRIP.subtitle || ""}`;
document.title = TRIP.title + " " + TRIP.date;
{ const sn = $("#snow"); for (let k = 0; k < 28; k++) { const f = document.createElement("i"); const sz = 3 + Math.random()*5;
  f.style.cssText = `left:${Math.random()*100}%;width:${sz}px;height:${sz}px;opacity:${.5+Math.random()*.5};--dx:${(Math.random()*60-30)|0}px;animation-duration:${5+Math.random()*6}s;animation-delay:${-Math.random()*8}s`; sn.appendChild(f); } }
$("#recapList").innerHTML = S.map((s, i) => `<li style="transition-delay:${i*90}ms"><b>${i+1}</b>${esc(s.name)}</li>`).join("");

const chipHTML = s => `<span class="chip" style="background:${periodColor(s.period)}">${esc(s.period)}${s.time ? `<span class="t">${esc(s.time)}</span>` : ""}</span>`;

let cardIdx = -1;
function fillCard(i){
  if (cardIdx === i) return; cardIdx = i; const s = S[i];
  bindImg($(".ph img", cardEl), i);
  $(".ph .num", cardEl).textContent = i + 1;
  const chip = $(".ph .chip", cardEl); chip.outerHTML = chipHTML(s);
  $("h2", cardEl).textContent = s.name; $(".en", cardEl).textContent = s.en || "";
  $(".hl", cardEl).textContent = s.highlight || "";
}

const dotsEl = $("#dots");
dotsEl.innerHTML = S.map((s, i) => `<button aria-label="第 ${i+1} 站 ${esc(s.name)}">${i+1}</button>`).join("");
const dotBtns = [...dotsEl.children];
dotBtns.forEach((b, i) => b.addEventListener("click", e => { e.stopPropagation(); jumpTo(i); }));
$("#ticks").innerHTML = S.map((s, i) => `<div class="tick" style="left:${(T0 + i*STOP + MOVE) / TOTAL * 100}%"></div>`).join("");

const ICON_PLAY = '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
const ICON_PAUSE = '<rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/>';
const ICON_REPLAY = '<path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/>';

/* ---------- list ---------- */
$("#stops").innerHTML = S.map((s, i) => `
  ${i > 0 && s.walk ? `<div class="walk">步行約 ${s.walk.min} 分鐘・${s.walk.m >= 1000 ? (s.walk.m/1000).toFixed(1) + " km" : s.walk.m + " m"}</div>` : (i > 0 ? `<div class="walk"></div>` : "")}
  <button class="stop" data-i="${i}">
    <div class="th"><img alt="" loading="lazy"><span class="num">${i+1}</span></div>
    <div class="tx"><div class="nm">${esc(s.name)}</div>${chipHTML(s)}<div class="hl">${esc(s.highlight)}</div></div>
  </button>`).join("");
document.querySelectorAll(".stop").forEach(b => { const i = +b.dataset.i; bindImg($("img", b), i); b.addEventListener("click", () => onStopTap(i, true)); });

/* ---------- detail sheet ---------- */
const sheet = $("#sheet"); let sheetIdx = -1, selected = -1;
function navUrl(s){ const dest = s.maps ? s.maps : s.coords.join(","); return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dest) + "&travelmode=walking"; }
function openSheet(i){
  sheetIdx = i; const s = S[i], p = $(".pn", sheet);
  bindImg($(".ph img", p), i); $(".ph .num", p).textContent = i + 1;
  $("h2", p).textContent = s.name; $(".en", p).textContent = s.en || "";
  $(".meta", p).innerHTML = chipHTML(s);
  $(".hl", p).textContent = s.highlight || "";
  const wk = $(".wk", p);
  wk.textContent = (i > 0 && s.walk) ? `🚶 從「${S[i-1].name}」步行約 ${s.walk.min} 分鐘（${s.walk.m >= 1000 ? (s.walk.m/1000).toFixed(1) + " km" : s.walk.m + " m"}）` : "";
  wk.style.display = wk.textContent ? "" : "none";
  const note = $(".note", p); $("span", note).textContent = s.note || ""; note.style.display = s.note ? "" : "none";
  $(".nav", p).href = navUrl(s);
  $(".prev", p).disabled = i === 0; $(".next", p).disabled = i === N - 1;
  p.scrollTop = 0;
  sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false"); $("#hint").classList.remove("show");
  select(i);
}
function closeSheet(){ sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); sheetIdx = -1; }
$(".bk", sheet).addEventListener("click", closeSheet);
$(".close", sheet).addEventListener("click", closeSheet);
$(".prev", sheet).addEventListener("click", () => sheetIdx > 0 && openSheet(sheetIdx - 1));
$(".next", sheet).addEventListener("click", () => sheetIdx < N - 1 && openSheet(sheetIdx + 1));

function select(i){
  selected = i;
  document.querySelectorAll(".stop").forEach(b => b.classList.toggle("sel", +b.dataset.i === i));
  if (state !== "playing") {
    S.forEach((_, k) => setMk(k, k === i ? "visited active" : (mkState[k] === "hidden" ? "hidden" : "visited")));
    map.flyTo(S[i].coords, Math.max(map.getZoom(), 16.5), { duration:.8 });
    lastCam = "";
  }
}

/* ---------- player state ---------- */
let t = 0, state = "playing", lastTs = 0, recapTimer = 0;
const playBtn = $("#playBtn");

function render(){
  let cam, baseF = 0, prog = [], cardOn = false, introOn = false, recapOn = false, active = -1, reached = -1, dotOn = -1;
  if (t < INTRO) {
    introOn = t < INTRO - .45;
    cam = { c: ov.c, z: ov.z - .6 * (1 - ease(t / INTRO)) };
  } else if (t < T0) {
    const l = t - INTRO; cam = ov; baseF = ease(clamp((l - .3) / 4.2));
    for (let k = 0; k < N; k++) if (baseF >= stopAt[k] - 1e-6 && (k > 0 || l > .25)) reached = k;
  } else if (t < TEND) {
    const i = Math.min(N - 1, Math.floor((t - T0) / STOP)), l = t - T0 - i * STOP, e = ease(clamp(l / MOVE));
    const from = i === 0 ? ov : stopCam(i - 1);
    fillCard(i);
    cam = mix(from, stopCam(i), e);
    baseF = 1; prog = routeUpTo(i, e); reached = N - 1;
    cardOn = l >= CARD_IN && l < CARD_OUT; active = l >= MOVE * .8 ? i : -1; dotOn = i;
    for (let k = 0; k < N; k++) setMk(k, k < i ? "visited" : k === i ? (active === i ? "visited active" : "visited") : "future");
  } else {
    const l = Math.min(t, TOTAL) - TEND, e = ease(clamp(l / 1.8));
    cam = mix(stopCam(N - 1), ov, e);
    baseF = 1; prog = fullRoute; reached = N - 1; recapOn = l > .6 && !recapHidden;
    for (let k = 0; k < N; k++) setMk(k, "visited");
  }
  if (t < T0) for (let k = 0; k < N; k++) setMk(k, k <= reached ? "future" : "hidden");

  apply(cam);
  baseLine.setLatLngs(baseF > 0 ? routeFrac(baseF) : []);
  casing.setLatLngs(prog); progLine.setLatLngs(prog);
  $("#intro").classList.toggle("off", !introOn);
  cardEl.classList.toggle("off", !cardOn);
  const rc = $("#recap"); rc.classList.toggle("off", !recapOn); rc.classList.toggle("on", recapOn);
  dotBtns.forEach((b, k) => { b.classList.toggle("on", k === dotOn); b.classList.toggle("done", t >= T0 + k * STOP + MOVE && k !== dotOn); });
  // progress bar
  const f = clamp(t / TOTAL) * 100;
  $("#bar .fill").style.width = f + "%"; $("#bar .thumb").style.left = f + "%";
  $("#time").textContent = fmt(t) + " / " + fmt(TOTAL);
}
let recapHidden = false;

function setState(st){
  state = st;
  playBtn.querySelector("svg").innerHTML = st === "playing" ? ICON_PAUSE : st === "ended" ? ICON_REPLAY : ICON_PLAY;
  playBtn.setAttribute("aria-label", st === "playing" ? "暫停" : st === "ended" ? "重播" : "播放");
  const inter = st !== "playing";
  ["dragging","touchZoom","doubleClickZoom","scrollWheelZoom","boxZoom","keyboard"].forEach(h => map[h] && (inter ? map[h].enable() : map[h].disable()));
  if (st === "playing") { selected = -1; document.querySelectorAll(".stop.sel").forEach(b => b.classList.remove("sel")); lastCam = ""; }
}
function flash(icon){ const f = $("#flash"); f.querySelector("svg").innerHTML = icon; f.classList.remove("show"); void f.offsetWidth; f.classList.add("show"); }
let hintTimer = 0;
function hint(msg, ms=2800){ const h = $("#hint"); h.textContent = msg; h.classList.add("show"); clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.remove("show"), ms); }

function play(){ if (t >= TOTAL) t = 0; recapHidden = false; clearTimeout(recapTimer); setState("playing"); lastTs = 0; render(); requestAnimationFrame(tick); }
function pause(showHint){ if (state !== "playing") return; setState("paused"); flash(ICON_PAUSE);
  if (showHint) hint("已暫停：可拖曳地圖、點站點看詳細；點地圖空白處繼續"); }
function toggle(){ if (state === "playing") pause(true); else { flash(ICON_PLAY); play(); } }
function replay(){ t = 0; closeSheet(); flash(ICON_PLAY); play(); }
function finish(){
  t = TOTAL; setState("ended"); render();
  clearTimeout(recapTimer);
  recapTimer = setTimeout(() => { if (state === "ended") { recapHidden = true; render(); hint("點地圖上的站點或下方清單，看每一站的詳細資訊", 3600); } }, 2200);
}
function tick(ts){
  if (state !== "playing") return;
  if (lastTs) t += Math.min(.1, (ts - lastTs) / 1000);
  lastTs = ts;
  if (t >= TOTAL) { finish(); return; }
  render(); requestAnimationFrame(tick);
}
function seek(nt){
  t = clamp(nt, 0, TOTAL); recapHidden = false; lastCam = "";
  if (state === "ended" && t < TOTAL) setState("paused");
  render();
}
function jumpTo(i){ closeSheet(); seek(T0 + i * STOP + CARD_IN + .05); if (state === "ended") setState("paused"); }

function onStopTap(i, fromList){
  if (state === "playing") { pause(false); }
  openSheet(i);
  if (fromList && window.innerWidth < 900) { /* sheet covers; map will be there when closed */ }
}

/* tap anywhere on the "video" to pause / resume */
map.on("click", () => { if (state === "playing") pause(true); else if (state === "paused") { flash(ICON_PLAY); play(); } });
cardEl.addEventListener("click", e => { e.stopPropagation(); if (state === "playing") pause(true); else if (cardIdx >= 0) openSheet(cardIdx); });
playBtn.addEventListener("click", e => { e.stopPropagation(); if (state === "ended") replay(); else toggle(); });
$("#replayBtn").addEventListener("click", e => { e.stopPropagation(); replay(); });
ctrlEl.addEventListener("click", e => e.stopPropagation());
L.DomEvent.disableClickPropagation(ctrlEl); L.DomEvent.disableClickPropagation(cardEl);

/* draggable progress bar */
const bar = $("#bar"); let scrub = null;
const tFromX = x => { const r = bar.getBoundingClientRect(); return clamp((x - r.left) / r.width) * TOTAL; };
bar.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); bar.setPointerCapture(e.pointerId);
  scrub = { was: state }; if (state === "playing") setState("paused"); seek(tFromX(e.clientX)); });
bar.addEventListener("pointermove", e => { if (scrub) seek(tFromX(e.clientX)); });
const endScrub = () => { if (!scrub) return; const was = scrub.was; scrub = null;
  if (t >= TOTAL) finish(); else if (was === "playing") play(); };
bar.addEventListener("pointerup", endScrub); bar.addEventListener("pointercancel", endScrub);
bar.addEventListener("keydown", e => { if (e.key === "ArrowRight") seek(t + 3); if (e.key === "ArrowLeft") seek(t - 3); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === " " && !sheet.classList.contains("open") && e.target === document.body) { e.preventDefault(); state === "ended" ? replay() : toggle(); }
});

let rsz = 0;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { measure(); lastCam = ""; if (state !== "ended" || recapHidden === false) render(); }, 120); });

/* ---------- start ---------- */
measure(); fillCard(0); render();
markers.forEach((m, i) => { const st = mkState[i]; mkState[i] = ""; setMk(i, st); });
const ready = Promise.all(S.map((_, i) => resolvePhoto(i)));
const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
Promise.race([Promise.all([ready, fonts]), new Promise(r => setTimeout(r, 1800))]).then(() => {
  measure(); lastCam = "";
  const q = new URLSearchParams(location.search);       // ?t=秒數 → 停在那個時間點（截圖/除錯用）
  if (q.has("t")) { setState("paused"); seek(parseFloat(q.get("t")) || 0); if (t >= TOTAL) finish(); }
  else play();
});
})();
</script>
</body>
</html>
