<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>澀谷散步日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Patrick+Hand&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one screen. Hand-drawn paper map fills the stage; an Instagram-style post rises from the bottom
   (phone) or sits in a right column (desktop); a step bar moves you to the next stop on tap. */
:root{
  --paper:#f7efdc; --paper-2:#fbf6ea; --card:#fffdf8;
  --ink:#4a3a2a; --ink-2:#7a6652; --line:#e8dcc2;
  --red:#d2553f; --green:#6f9a4c; --blue:#4f86ad; --amber:#e0a23a;
  --f-hand:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-en:"Patrick Hand","Huninn",cursive;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --nav-h:72px; --sheet-h:60vh; --peek-h:70px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f-body)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--paper);touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#cam{position:absolute;left:0;top:0;transform-origin:0 0}
#cam>*{position:absolute;left:0;top:0;display:block}
#baseCv{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
#stage.moving.raster #baseCv{display:block}
#map{overflow:visible}
/* while the camera moves, show only the pre-rendered picture of the base map (cheap to scale) */
#stage.moving.raster #mapBase{display:none}
#stage.moving .st .ring{animation:none}
.renderbase #title,.renderbase #chip,.renderbase #walkmsg,.renderbase #zoomBtns,.renderbase #sheet,.renderbase #nav,.renderbase #map,.renderbase #baseCv{display:none!important}
.renderbase #cam{transform:none!important}
.renderbase #stage{inset:0 auto auto 0!important;width:2000px;height:2000px;overflow:visible}

/* map text */
.lb text{font-family:var(--f-hand);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.lb-area .zh{font-size:22px;fill:#6b5a46;letter-spacing:2px}
.lb-area .en{font-family:var(--f-en);font-size:14px;fill:#8a765f}
.lb-road .zh{font-size:12px;fill:#8a6d4f;stroke-width:3px;letter-spacing:1px}
.lb-sta rect{fill:#fff;stroke:#4f7f4f;stroke-width:2}
.lb-sta text{font-size:11px;fill:#3f6b3f;stroke:none}

/* stops on the map */
.st{cursor:pointer}
.st .lead{stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:2 4;fill:none}
.st .nm{font-family:var(--f-hand);font-size:17px;fill:var(--ink);paint-order:stroke;stroke:var(--paper-2);stroke-width:5px;stroke-linejoin:round;text-anchor:middle}
.st .en{font-family:var(--f-en);font-size:12px;fill:var(--ink-2);paint-order:stroke;stroke:var(--paper-2);stroke-width:4px;text-anchor:middle}
.st .ic{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.st .pin circle{fill:#fff;stroke:var(--ink);stroke-width:2.5;transition:fill .3s}
.st .pin text{font-family:var(--f-hand);font-size:15px;fill:var(--ink);text-anchor:middle}
.st.done .pin circle{fill:var(--red);stroke:#fff}
.st.done .pin text{fill:#fff}
.st.cur .pin circle{fill:var(--red);stroke:#fff}
.st.cur .pin text{fill:#fff}
.st .ring{fill:none;stroke:var(--red);stroke-width:3;opacity:0}
.st.cur .ring{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{r:14;opacity:.9}100%{r:30;opacity:0}}
.st.pop .ic{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:var(--ict) scale(.6)}100%{transform:var(--ict) scale(1)}}
.leg-base{fill:none;stroke:#9c7f5f;stroke-width:4;stroke-linecap:round;stroke-dasharray:.1 10;opacity:.75}
.leg-case{fill:none;stroke:var(--paper-2);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.leg-done{fill:none;stroke:var(--red);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}

/* title cartouche */
#title{position:absolute;z-index:20;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));
  display:flex;justify-content:center;pointer-events:none;transition:opacity .4s,transform .4s}
#title .card{pointer-events:auto;background:rgba(251,246,234,.94);border:2px solid var(--ink);border-radius:18px;padding:10px 18px 9px;text-align:center;
  box-shadow:4px 4px 0 rgba(74,58,42,.25);transform:rotate(-1.2deg)}
#title h1{margin:0;font-family:var(--f-hand);font-weight:400;font-size:clamp(32px,9.5vw,46px);line-height:1.1;letter-spacing:3px}
#title h1 span:nth-child(4n+1){color:var(--red)}#title h1 span:nth-child(4n+2){color:var(--green)}
#title h1 span:nth-child(4n+3){color:var(--blue)}#title h1 span:nth-child(4n+4){color:var(--amber)}
#title .en{font-family:var(--f-en);font-size:20px;color:var(--ink-2);line-height:1.1}
#title .date{font-family:var(--f-hand);font-size:17px;color:var(--ink);margin-top:2px}
#chip{position:absolute;z-index:20;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;
  background:rgba(251,246,234,.95);border:2px solid var(--ink);border-radius:999px;padding:5px 12px 5px 6px;font-family:var(--f-hand);font-size:15px;
  box-shadow:3px 3px 0 rgba(74,58,42,.2);transition:opacity .3s,transform .3s}
#chip b{display:grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;font-weight:400;padding:0 6px}
.hide{opacity:0!important;pointer-events:none!important;transform:translateY(-8px)}
#walkmsg{position:absolute;z-index:21;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);white-space:nowrap;
  background:var(--ink);color:var(--paper-2);font-family:var(--f-hand);font-size:16px;padding:7px 14px;border-radius:999px;transition:opacity .3s}
#walkmsg.hide{transform:translateX(-50%) translateY(-6px)}
#zoomBtns{position:absolute;z-index:19;right:max(12px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
#zoomBtns button{width:40px;height:40px;border-radius:12px;background:rgba(251,246,234,.95);border:2px solid var(--ink);font-family:var(--f-hand);font-size:22px;line-height:1;box-shadow:2px 2px 0 rgba(74,58,42,.2)}
#zoomBtns button.wide{font-size:13px;height:auto;padding:6px 0;line-height:1.2}

/* bottom step bar */
#nav{position:absolute;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:var(--paper-2);border-top:2px solid var(--ink);display:flex;align-items:center;gap:10px}
#prev{flex:none;width:46px;height:50px;border-radius:14px;border:2px solid var(--ink);font-size:22px;font-family:var(--f-hand);background:var(--card)}
#prev:disabled{opacity:.3}
#dots{flex:1;min-width:0;display:flex;justify-content:center;gap:5px}
#dots button{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-family:var(--f-hand);font-size:14px;line-height:1;display:grid;place-items:center}
#dots button.done{background:#f4d9cf}
#dots button.cur{background:var(--red);border-color:var(--red);color:#fff;transform:scale(1.12)}
#next{flex:none;height:50px;padding:0 18px;border-radius:14px;background:var(--red);color:#fff;font-family:var(--f-hand);font-size:19px;letter-spacing:1px;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
#next:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* sheet (Instagram-style post) */
#sheet{position:absolute;z-index:30;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));height:var(--sheet-h);margin:0 auto;max-width:560px;
  background:var(--card);border:2px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(74,58,42,.18);
  display:flex;flex-direction:column;transform:translateY(calc(100% + 30px));transition:transform .42s cubic-bezier(.2,.9,.25,1)}
#sheet.open{transform:none}
#sheet.peek{transform:translateY(calc(var(--sheet-h) - var(--peek-h)))}
#grab{flex:none;height:16px;display:grid;place-items:center;cursor:pointer;touch-action:none}
#grab::before{content:"";width:44px;height:5px;border-radius:3px;background:#d5c6a8}
#sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

.ph{display:flex;align-items:center;gap:10px;padding:0 14px 10px;cursor:pointer;touch-action:none}
.av{flex:none;width:44px;height:44px;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,var(--amber),var(--red),#c2457a,var(--amber))}
.av img,.av .ini{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--card);display:block;background:var(--paper)}
.av .ini{display:grid;place-items:center;font-family:var(--f-hand);font-size:18px;color:var(--red)}
.who{min-width:0;flex:1;line-height:1.3}
.who b{display:block;font-size:15px;font-weight:700}
.who span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip{flex:none;font-size:13px;font-weight:700;color:#fff;padding:4px 10px;border-radius:999px;white-space:nowrap}

.car{position:relative;background:var(--paper)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:5/4;max-width:100%}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden}
.slide img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.cnt{position:absolute;right:10px;top:10px;background:rgba(30,24,18,.62);color:#fff;font-size:12.5px;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.cred{position:absolute;left:8px;bottom:8px;max-width:70%;background:rgba(30,24,18,.5);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smp{position:absolute;left:8px;top:10px;background:var(--amber);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.arw{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:rgba(255,253,248,.9);color:var(--ink);font-size:18px;display:none;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.arw.l{left:8px}.arw.r{right:8px}
@media (hover:hover){.car:hover .arw{display:grid}}
.bigheart{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;fill:#fff;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.bigheart.go{animation:bh .8s ease-out}
@keyframes bh{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.1)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

.acts{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;position:relative}
.acts .ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.acts svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.acts .like.on svg{fill:var(--red);stroke:var(--red)}
.acts .navp{margin-left:auto;display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:999px;border:2px solid var(--ink);font-size:14px;font-weight:700;color:var(--ink);text-decoration:none}
.acts .navp svg{width:16px;height:16px;fill:var(--red);stroke:none}
.cdots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.cdots i{width:7px;height:7px;border-radius:50%;background:#d8cbb0;transition:background .2s,transform .2s}
.cdots i.on{background:var(--blue);transform:scale(1.15)}

.cap{padding:4px 16px 22px;font-size:16px;line-height:1.7}
.meta{font-size:14px;font-weight:700;margin:2px 0 6px;color:var(--ink)}
.cap h2{font-family:var(--f-hand);font-weight:400;font-size:27px;margin:4px 0 6px;line-height:1.25;text-wrap:balance}
.cap h2 small{font-family:var(--f-en);font-size:18px;color:var(--ink-2);margin-left:6px}
.cap p{margin:0 0 10px}
.cap p .h{font-weight:700;margin-right:6px}
.todo{list-style:none;margin:12px 0;padding:12px 14px;background:var(--paper-2);border:1.5px dashed #cdb894;border-radius:14px}
.todo b{display:block;font-family:var(--f-hand);font-weight:400;font-size:17px;margin-bottom:4px}
.todo li{display:flex;gap:8px;align-items:flex-start}
.todo li::before{content:"✓";color:var(--green);font-weight:700}
.note{margin:12px 0;padding:10px 14px;background:#fdf1d8;border-left:4px solid var(--amber);border-radius:10px;font-size:15.5px}
.note b{display:block;font-size:13px;color:var(--ink-2);letter-spacing:.08em}
.tags{color:var(--blue);font-weight:500}
.navbig{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;margin:14px 0 4px;border-radius:14px;background:var(--ink);color:var(--paper-2);text-decoration:none;font-size:17px;font-weight:700}
.navbig svg{width:20px;height:20px;fill:var(--amber)}

/* overview list */
.ov{padding:0 14px 22px}
.ov .sum{font-size:15px;color:var(--ink-2);margin:2px 2px 12px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px;border-radius:14px;background:var(--paper-2);border:1.5px solid var(--line)}
.row img{flex:none;width:62px;height:62px;border-radius:10px;object-fit:cover}
.row .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--f-hand);font-size:15px}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-family:var(--f-hand);font-weight:400;font-size:19px;line-height:1.3}
.row .t span{font-size:13.5px;color:var(--ink-2)}
.wk{font-size:13px;color:var(--ink-2);padding:5px 0 5px 44px}
.again{display:block;width:100%;height:52px;margin-top:14px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-family:var(--f-hand);font-size:18px}
.foot{font-size:12px;color:var(--ink-2);margin-top:16px;line-height:1.6}

/* desktop: map left, post column right */
@media (min-width:900px){
  #stage{right:440px}
  #sheet{left:auto;right:0;top:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));width:440px;max-width:none;height:auto;border-radius:0;border:0;border-left:2px solid var(--ink);box-shadow:none;transform:none!important}
  #grab{display:none}
  .ph{padding-top:14px;cursor:default}
  #nav{left:auto;width:440px;border-left:2px solid var(--ink)}
  #title{right:460px}
  #zoomBtns{right:456px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

}
const dOf = l => "M" + l.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
const routesG = $("#routes"), legEls = [];
routesG.innerHTML = legs.map((l, i) => l ? `<path class="leg-base" d="${dOf(l)}"/>` : "").join("");

    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    S.forEach((s, k) => { const [x, y] = P[k], [dx, dy] = s.iconAt || [0, -58];
      x0 = Math.min(x0, x - 16, x + dx - 40); x1 = Math.max(x1, x + 16, x + dx + 40); y0 = Math.min(y0, y - 16, y + dy - 52); y1 = Math.max(y1, y + 16, y + dy + 40); });
    const pad = 16, s = Math.min((v.vw - pad*2) / (x1 - x0), (v.vh - pad*2) / (y1 - y0), 1.4);

  heart: '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.3 1 5 3 1.7-2 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.6-4.3A8.5 8.5 0 1 1 20.5 11.5z"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>'
};
const navUrl = s => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(s.maps || s.coords.join(",")) + "&travelmode=walking";

function postHTML(i){
  const s = S[i], ph = s._photos.length ? s._photos : [{ url: placeholder(s), by: "" }];
  const liked = !!likes[s.name];
  return `<article class="post" data-i="${i}">
    <header class="ph"><div class="av"><img src="${esc(ph[0].thumb || ph[0].url)}" data-full="${esc(ph[0].url)}" alt=""></div>
      <div class="who"><b>${esc(s.handle || s.name)}</b><span>${esc(s.area || "")}</span></div>
      <span class="tchip" style="background:${pcolor(s.period)}">${esc(s.period)} ${esc(s.time || "")}</span></header>
    <div class="car"><div class="track">${ph.map((p, k) => `<div class="slide"><img src="${esc(p.med || p.url)}" data-full="${esc(p.url)}" alt="${esc(s.name)} 照片 ${k+1}" style="object-position:${esc(p.focus || "50% 50%")}" draggable="false">
        ${p.sample ? '<span class="smp">示意</span>' : ""}${p.by ? `<span class="cred">© ${esc(p.by)}</span>` : ""}</div>`).join("")}</div>
      ${ph.length > 1 ? `<span class="cnt">1/${ph.length}</span><button class="arw l" aria-label="上一張">‹</button><button class="arw r" aria-label="下一張">›</button>` : ""}
      <svg class="bigheart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.3 1 5 3 1.7-2 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg></div>
    <div class="acts"><button class="ib like${liked ? " on" : ""}" aria-label="喜歡" aria-pressed="${liked}">${ICONS.heart}</button>
      <button class="ib chat" aria-label="看介紹">${ICONS.chat}</button>
      <a class="navp" href="${navUrl(s)}" target="_blank" rel="noopener">${ICONS.pin}導航</a>
      ${ph.length > 1 ? `<div class="cdots">${ph.map((_, k) => `<i class="${k ? "" : "on"}"></i>`).join("")}</div>` : ""}</div>
    <div class="cap">
      <div class="meta">第 ${i+1} 站・${esc(s.period)} ${esc(s.time || "")}${i > 0 && s.walk ? `・從${esc(S[i-1].name)}步行約 ${s.walk.min} 分鐘` : ""}</div>
      <h2>${esc(s.name)}<small>${esc(s.en || "")}</small></h2>
      ${(s.desc && s.desc.length ? s.desc : [s.highlight]).map((p, k) => `<p>${k === 0 ? `<span class="h">${esc(s.handle || "")}</span>` : ""}${esc(p)}</p>`).join("")}
      ${s.todo && s.todo.length ? `<ul class="todo"><b>今天要做的事</b>${s.todo.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      ${s.note ? `<div class="note"><b>備註</b>${esc(s.note)}</div>` : ""}
      ${s.tags && s.tags.length ? `<p class="tags">${s.tags.map(t => "#" + esc(t)).join(" ")}</p>` : ""}
      <a class="navbig" href="${navUrl(s)}" target="_blank" rel="noopener">${ICONS.pin}用 Google Maps 導航到這裡</a>
    </div></article>`;
}
function listHTML(end){
  const totM = S.reduce((a, s) => a + (s.walk ? s.walk.m : 0), 0), totMin = S.reduce((a, s) => a + (s.walk ? s.walk.min : 0), 0);
  return `<header class="ph"><div class="av"><div class="ini">${end ? "✓" : "雪"}</div></div>
      <div class="who"><b>${end ? "今日回顧" : esc(TRIP.title)}</b><span>${esc(TRIP.date)}・${N} 站・步行約 ${km(totM)}（${totMin} 分鐘）</span></div></header>
    <div class="ov"><p class="sum">${end ? "今天走過的地方，點一下可以回到那一站。" : "按下方「出發」，一站一站走一遍；也可以直接點想看的站。"}</p>
    ${S.map((s, i) => `${i > 0 && s.walk ? `<div class="wk">步行約 ${s.walk.min} 分鐘・${km(s.walk.m)}</div>` : ""}
      <button class="row" data-go="${i}"><span class="n">${i+1}</span><img src="${esc((s._photos[0] || { thumb: placeholder(s) }).thumb)}" data-full="${esc((s._photos[0] || {}).url || "")}" alt="">
        <span class="t"><b>${esc(s.name)}</b><span>${esc(s.period)} ${esc(s.time || "")}・${esc(s.highlight || "")}</span></span></button>`).join("")}
    ${end ? '<button class="again" data-go="0">再走一次</button>' : ""}
    <p class="foot">${esc(BM.attribution)}。照片來自 Unsplash（Unsplash License），標「示意」的是相似場景、不是該店本身。</p></div>`;
}
function fillSheet(){
  sbody.innerHTML = cur >= 0 && cur < N ? postHTML(cur) : listHTML(cur >= N);
  sbody.scrollTop = 0;
  const post = sbody.querySelector(".post");
  sbody.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
  sbody.querySelector(".ph").addEventListener("click", () => { if (!wideMQ.matches) setSheet(sheetState === "open" ? "peek" : "open"); });
  if (!post) return;
  const i = +post.dataset.i, track = post.querySelector(".track"), slides = track.children.length;
  const cnt = post.querySelector(".cnt"), dots = [...post.querySelectorAll(".cdots i")];
  let idx = 0;
  track.addEventListener("scroll", () => { const k = Math.round(track.scrollLeft / track.clientWidth); if (k === idx) return; idx = k;
    if (cnt) cnt.textContent = (k + 1) + "/" + slides; dots.forEach((d, j) => d.classList.toggle("on", j === k)); }, { passive: true });
  const to = k => track.scrollTo({ left: clamp(k, 0, slides - 1) * track.clientWidth, behavior: reduce ? "auto" : "smooth" });
  post.querySelector(".arw.l")?.addEventListener("click", () => to(idx - 1));
  post.querySelector(".arw.r")?.addEventListener("click", () => to(idx + 1));
  const like = post.querySelector(".like"), heart = post.querySelector(".bigheart");
  const setLike = v => { likes[S[i].name] = v; if (!v) delete likes[S[i].name]; saveLikes(); like.classList.toggle("on", v); like.setAttribute("aria-pressed", v); };
  like.onclick = () => setLike(!like.classList.contains("on"));
  let lastTap = 0;
  track.addEventListener("click", () => { const t = Date.now(); if (t - lastTap < 320) { setLike(true); heart.classList.remove("go"); void heart.offsetWidth; heart.classList.add("go"); } lastTap = t; });
  post.querySelector(".chat").onclick = () => { if (!wideMQ.matches) setSheet("open"); post.querySelector(".cap").scrollIntoView({ behavior: "smooth", block: "start" }); };
}

/* ---------------- step logic ---------------- */
let cur = -1, busy = false;
const dotsEl = $("#dots");
dotsEl.innerHTML = S.map((s, i) => `<button aria-label="第 ${i+1} 站 ${esc(s.name)}">${i+1}</button>`).join("");
const dotEls = [...dotsEl.children];
dotEls.forEach((b, i) => b.onclick = () => go(i));
$("#tH").innerHTML = [...TRIP.title].map(c => `<span>${esc(c)}</span>`).join("");
$("#tEn").textContent = TRIP.en || ""; $("#tDate").textContent = TRIP.date || "";
document.title = TRIP.title;

function paint(){
  stEls.forEach((g, i) => { g.classList.toggle("cur", i === cur); g.classList.toggle("done", cur >= N ? true : i < cur); });
  dotEls.forEach((b, i) => { b.classList.toggle("cur", i === cur); b.classList.toggle("done", cur >= N || i < cur); });
  for (let k = 1; k < N; k++) setLeg(k, cur >= N || k <= cur ? 1 : 0);
  $("#prev").disabled = cur < 0;
  $("#next").textContent = cur < 0 ? "出發 ›" : cur < N - 1 ? "下一站 ›" : cur === N - 1 ? "回顧 ›" : "再走一次 ↺";
  $("#title").classList.toggle("hide", cur >= 0 && cur < N);
  $("#chip").classList.toggle("hide", !(cur >= 0 && cur < N));
  if (cur >= 0 && cur < N) { $("#chipN").textContent = (cur + 1) + "/" + N; $("#chipT").textContent = S[cur].name; }
}
async function go(target){
  if (busy || target === cur) { if (target === cur && !wideMQ.matches) setSheet("open"); return; }
  busy = true;
  preloadStop(target);                 // fetch this stop's photos while the walk animation plays
  const from = cur, walking = target === from + 1 && target >= 1 && target < N;
  if (!wideMQ.matches) { sheet.classList.remove("open", "peek"); sheetState = "hidden"; }
  const endSheet = target >= 0 && target < N ? "open" : "peek";
  const vEnd = view(endSheet, target), vGo = view("hidden", target);
  setV(vGo);
  if (target >= 0 && target < N) stEls[target].classList.remove("pop");
  if (walking) {
    const s = S[target], B = camFor(target, vGo), A = { ...C };
    const Lpx = legLen[target] * B.s, dur = reduce ? 200 : clamp(1300 + Lpx * .9, 1600, 3200);
    $("#walkmsg").textContent = `往「${s.name}」步行約 ${s.walk ? s.walk.min + " 分鐘" : ""}`; $("#walkmsg").classList.remove("hide");
    walkerUse.style.display = ""; paint();
    for (let k = 1; k < N; k++) setLeg(k, k < target ? 1 : 0);
    const la = Math.log(A.s), lb = Math.log(B.s);
    await tween(dur, e => {
      const k = ease(e), p = legAt(target, k);
      walkerUse.setAttribute("transform", `translate(${p[0].toFixed(1)} ${p[1].toFixed(1)})`);
      setLeg(target, k);
      const edge = Math.min(1, k / .2, (1 - k) / .2);             // blend into / out of following the walker
      const tx = A.x + (B.x - A.x) * k, ty = A.y + (B.y - A.y) * k;
      C = { x: tx + (p[0] - tx) * edge, y: ty + (p[1] - ty) * edge, s: Math.exp(la + (lb - la) * k) * (1 - .3 * Math.sin(Math.PI * k)) };
    });
    walkerUse.style.display = "none"; $("#walkmsg").classList.add("hide");
  } else {
    await flyTo(camFor(target, vGo));
  }
  cur = target; paint();
  if (cur >= 0 && cur < N) { const g = stEls[cur]; void g.offsetWidth; g.classList.add("pop"); }
  fillSheet();
  busy = false;
  if (!wideMQ.matches) { sheetState = endSheet; sheet.classList.toggle("open", endSheet === "open"); sheet.classList.toggle("peek", endSheet === "peek");
    setV(vEnd); flyTo(camFor(cur, vEnd), 420); }
}
$("#next").onclick = () => go(cur >= N ? 0 : cur + 1);
$("#prev").onclick = () => go(cur - 1);
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") $("#next").click(); if (e.key === "ArrowLeft" && cur >= 0) $("#prev").click(); });

/* sheet handle: tap toggles, swipe up/down */
(() => { let y0 = null;
  const grab = $("#grab");
  grab.addEventListener("pointerdown", e => { y0 = e.clientY; grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointerup", e => { if (y0 === null) return; const dy = e.clientY - y0; y0 = null;
    if (Math.abs(dy) < 8) setSheet(sheetState === "open" ? "peek" : "open"); else setSheet(dy > 0 ? "peek" : "open"); });
})();

/* ---------------- start ---------------- */
function layout(){
  const vh = window.innerHeight;
  document.documentElement.style.setProperty("--sheet-h", Math.round(clamp(vh * .62, 360, 620)) + "px");
  V = view();
  if (!busy) { C = camFor(cur >= 0 && cur < N ? cur : -1, V); apply(); }
}
let rt = 0; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { V = null; layout(); }, 120); });
wideMQ.addEventListener?.("change", () => { V = null; layout(); });
paint(); fillSheet(); layout();
if (!wideMQ.matches) { sheetState = "peek"; sheet.classList.add("peek"); V = view(); C = camFor(-1, V); apply(); }
// load order: thumbnails, first stop, then everything else in the background
S.forEach(s => s._photos[0] && preload(s._photos[0].thumb));
preloadStop(0);
const idle = window.requestIdleCallback || (f => setTimeout(f, 600));
idle(async () => { for (let i = 0; i < N; i++) { await Promise.all(S[i]._photos.map(p => preload(p.med))); } });
findUserPhotos().then(() => { if (sbody.querySelector(".ov")) fillSheet(); });
})();
</script>
</body>
</html>
