<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>東京・湘南旅行帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: a travel journal lying open on a wooden desk. Pages are laid out at a fixed size and scaled to the screen;
   two-page spreads on wide screens, one page on phones. Single deliberate look (paper on wood) in both themes. */
:root{
  --desk:#3A312B; --desk-2:#2C2520; --paper:#FBF6EC; --paper-2:#F3EBDC; --ink:#3B3431; --muted:#857A71;
  --beni:#C9473E; --sakura:#EBA9A7; --matcha:#A9C796; --sora:#9CC3DE; --yuzu:#F3CD73; --memo:#FFF4C9;
  --on-desk:#F3EBDC; --on-desk-muted:#B9AC9F;
  --f-hand:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti",serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-latin:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--desk);color:var(--on-desk);font-family:var(--f-hand);overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 40%,var(--desk) 0%,var(--desk-2) 100%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk-2)}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}

/* top and bottom bars on the desk */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px;min-height:40px}
.brand{font-weight:700;font-size:17px;letter-spacing:.06em;white-space:nowrap}
.brand small{font:500 15px var(--f-latin);color:var(--on-desk-muted);margin-left:8px;letter-spacing:0}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:700 14px var(--f-hand);color:var(--on-desk);background:transparent;border:1.5px solid var(--on-desk-muted);border-radius:999px;
  padding:5px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--on-desk)}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,.toc a:focus-visible{outline:2px solid var(--yuzu);outline-offset:2px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;perspective:2400px}
.bottombar{display:flex;align-items:center;gap:12px;padding-block:6px calc(10px + env(safe-area-inset-bottom,0px))}
.navbtn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--on-desk-muted);background:transparent;color:var(--on-desk);
  font-size:20px;cursor:pointer;line-height:1}
.navbtn:disabled{opacity:.3;cursor:default}
#slider{flex:1;min-width:0;accent-color:var(--yuzu)}
#pagelabel{font:700 18px var(--f-latin);min-width:92px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}

/* the book */
.book{position:relative;display:flex;transform-origin:center center;transform-style:preserve-3d}
.slot{position:relative;width:var(--pw);height:var(--ph)}
.slot.empty{visibility:hidden}
.page{position:absolute;inset:0;width:var(--pw);height:var(--ph);box-sizing:border-box;background:var(--paper);color:var(--ink);overflow:hidden;
  font:400 15.5px/1.72 var(--f-hand);
  background-image:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.5),transparent 40%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .25  0 0 0 .06 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  box-shadow:0 1px 2px rgba(0,0,0,.25)}
.slot.left .page{border-radius:6px 2px 2px 6px;box-shadow:inset -18px 0 26px -18px rgba(80,55,30,.35),0 8px 30px rgba(0,0,0,.35)}
.slot.right .page{border-radius:2px 6px 6px 2px;box-shadow:inset 18px 0 26px -18px rgba(80,55,30,.35),0 8px 30px rgba(0,0,0,.35)}
.single .slot .page{border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.35)}

/* turning leaf */
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;pointer-events:none}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face .page{box-shadow:none}
.leaf .back{transform:rotateY(180deg)}
.leaf .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(60,40,20,.28),rgba(60,40,20,0) 40%,rgba(255,255,255,.12) 70%,rgba(60,40,20,.12));opacity:0}

/* page furniture */
.page .inner{position:absolute;inset:34px 36px 40px}
.runhead{position:absolute;top:12px;left:36px;right:36px;display:flex;align-items:center;gap:6px;font:600 15px var(--f-latin);color:var(--muted)}
.runhead svg{width:22px;height:22px}
.runhead .rh-ch{font:700 12.5px var(--f-hand);letter-spacing:.06em}
.folio{position:absolute;bottom:10px;left:0;right:0;text-align:center;font:700 16px var(--f-latin);color:var(--muted)}
.flow{position:absolute;inset:0;overflow:hidden}
.flow>*:first-child{margin-top:0}

/* content typography */
.page h2{display:inline-block;position:relative;margin:16px 0 8px;padding:3px 14px 3px 12px;font-size:20px;line-height:1.35;font-weight:700;
  transform:rotate(-.6deg);clip-path:polygon(0 4%,3% 0,97% 6%,100% 0,99% 50%,100% 96%,96% 100%,3% 94%,0 100%,1% 50%)}
.page[data-washi="sakura"] h2{background:rgba(235,169,167,.62)}
.page[data-washi="matcha"] h2{background:rgba(169,199,150,.66)}
.page[data-washi="sora"] h2{background:rgba(156,195,222,.66)}
.page[data-washi="yuzu"] h2{background:rgba(243,205,115,.7)}
.page h3{margin:14px 0 4px;font-size:17px;font-weight:700;display:inline-block;
  background:linear-gradient(transparent 62%,rgba(243,205,115,.55) 62%,rgba(243,205,115,.55) 92%,transparent 92%)}
.page p{margin:6px 0}
.page ul,.page ol{margin:6px 0;padding-left:1.25em}
.page ol{padding-left:1.9em}
.page ul{list-style:none;padding-left:1.1em}
.page ul>li{position:relative}
.page ul>li::before{content:"";position:absolute;left:-1em;top:.62em;width:.48em;height:.48em;border-radius:50% 45% 55% 40%;background:var(--sakura);opacity:.9}
.page li{margin:2px 0}
.page strong{font-weight:700;background:linear-gradient(transparent 58%,rgba(235,169,167,.45) 58%)}
.page a{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}
.page hr{border:0;height:10px;margin:12px 0;background:radial-gradient(circle,var(--muted) 1.2px,transparent 1.6px) 0 50%/12px 10px repeat-x;opacity:.5}
.page code{font-family:var(--f-sans);font-size:.9em;background:var(--paper-2);padding:0 4px;border-radius:3px}
.page pre{white-space:pre-wrap;font-size:12px}
.page blockquote{position:relative;margin:12px 4px;padding:12px 14px 10px;background:var(--memo);transform:rotate(.5deg);box-shadow:0 2px 6px rgba(90,70,40,.18);font-size:14.5px}
.page blockquote::before{content:"MEMO";position:absolute;top:-10px;left:16px;padding:0 10px;font:700 14px var(--f-latin);letter-spacing:.06em;
  background:rgba(156,195,222,.75);transform:rotate(-2deg)}
.page blockquote p{margin:3px 0}
.stamp{display:inline-block;font:700 11px/1 var(--f-hand);color:var(--beni);border:1.5px solid var(--beni);border-radius:50%;padding:5px 3px;
  transform:rotate(-8deg);vertical-align:1px;margin:0 2px;opacity:.9}
.todo{list-style:none}
.page ul>li.todo::before{display:none}
.todo .box{display:inline-block;width:13px;height:13px;border:1.6px solid var(--ink);border-radius:2px;margin:0 8px 0 -1.1em;vertical-align:-1px;transform:rotate(-3deg)}

.tw{margin:8px 0}
.page table{border-collapse:collapse;width:100%;font:400 12.6px/1.5 var(--f-sans);font-variant-numeric:tabular-nums}
.page th{font:700 12.6px/1.4 var(--f-hand);text-align:left;padding:5px 6px;background:rgba(243,205,115,.42)}
.page td{padding:5px 6px;vertical-align:top;border-bottom:1px dashed rgba(133,122,113,.45)}
.page td:first-child{font-weight:700;min-width:3.2em}
.page table.cont caption{caption-side:top;text-align:right;font:600 13px var(--f-latin);color:var(--muted)}

figure{margin:10px 0}
.artfig .art{display:block;width:100%;height:auto;max-height:calc(var(--flowh) * .9)}
.artfig{cursor:zoom-in}
svg text.hand{font-family:var(--f-hand)}
svg text.latin{font-family:var(--f-latin);font-size-adjust:none}
.photo{position:relative;background:#fff;padding:7px 7px 6px;box-shadow:0 3px 10px rgba(80,60,40,.25);transform:rotate(-1.2deg);margin:14px 6px}
.photo:nth-of-type(even){transform:rotate(1.1deg)}
.photo::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:20px;transform:translateX(-50%) rotate(-3deg);background:rgba(169,199,150,.7)}
.photo img{display:block;width:100%;height:auto;max-height:calc(var(--flowh) * .42);object-fit:cover}
.photo figcaption{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding-top:4px;font-size:13.5px}
.photo figcaption small{font:400 9.5px/1.3 var(--f-sans);color:var(--muted);text-align:right}
.photo.pending .ph,.hero.pending .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:150px;
  background:radial-gradient(ellipse at 40% 40%,rgba(156,195,222,.45),rgba(169,199,150,.3) 60%,transparent 75%);color:var(--muted);font-size:13px}

/* special pages */
.cover .art{position:absolute;inset:0;width:100%;height:100%}
.cover-title{position:absolute;left:34px;right:34px;top:40px}
.cover-title .kicker{font:700 20px var(--f-latin);color:var(--ink);letter-spacing:.04em}
.cover-title h1{margin:4px 0 0;font-size:50px;line-height:1.15;font-weight:700;color:var(--ink);text-wrap:balance}
.cover-title .sub{margin-top:8px;font-size:17px}
.cover-issue{position:absolute;right:30px;top:244px;width:96px;height:96px;border-radius:50%;background:var(--beni);color:#FFF6E8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(10deg);text-align:center;line-height:1.2}
.cover-issue b{font-size:20px}.cover-issue span{font-size:12px}
.opener-hero{position:absolute;inset:0;display:flex;flex-direction:column}
.opener-hero .hero{margin:0;flex:1;display:flex;flex-direction:column;position:relative}
.opener-hero .hero img{flex:1;min-height:0;width:100%;object-fit:cover}
.opener-hero .hero figcaption{position:absolute;left:18px;bottom:18px;background:var(--paper);padding:4px 10px;font-size:14px;transform:rotate(-1.5deg);
  box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;flex-direction:column}
.opener-hero .hero figcaption small{font:400 9.5px var(--f-sans);color:var(--muted)}
.opener-hero .hero.pending .ph{flex:1;height:auto}
.opener-hero .bignum{position:absolute;right:22px;top:4px;font:700 120px/1 var(--f-latin);color:rgba(255,255,255,.88);text-shadow:0 2px 12px rgba(0,0,0,.25)}
.opener-hero .hero.pending ~ .bignum{color:rgba(201,71,62,.75);text-shadow:none}
.opener h1{font-size:34px;line-height:1.25;margin:6px 0 2px;text-wrap:balance}
.opener .chlabel{font:700 24px var(--f-latin);color:var(--beni)}
.opener .romaji{font:600 18px var(--f-latin);color:var(--muted);margin:0 0 10px}
.opener .stk{position:absolute;right:28px;top:26px;transform:rotate(8deg)}
.contents{list-style:none;padding:0;margin:14px 0 0;font-size:14.5px}
.contents li{display:flex;gap:6px;align-items:baseline;padding:2px 0}
.contents li::before{display:none}
.contents a{text-decoration:none;flex:1;min-width:0;display:flex;gap:6px}
.contents .dots{flex:1;border-bottom:1.5px dotted var(--muted);transform:translateY(-4px)}
.contents .pn{font:700 16px var(--f-latin);font-variant-numeric:tabular-nums}
.toc-page h2{font-size:26px}
.toc-grid{display:grid;grid-template-columns:1fr;gap:4px;margin-top:10px}
.toc-row{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:3px 0;border-bottom:1px dashed rgba(133,122,113,.35)}
.toc-row svg{width:34px;height:34px;flex:0 0 auto}
.toc-row .t{flex:1;min-width:0;font-size:16.5px;font-weight:700}
.toc-row .r{font:600 14px var(--f-latin);color:var(--muted)}
.toc-row .pn{font:700 20px var(--f-latin);min-width:2em;text-align:right}
.memo-page .grid{position:absolute;inset:60px 36px 50px;background-image:radial-gradient(circle,rgba(133,122,113,.35) 1px,transparent 1.4px);background-size:18px 18px}
.memo-page .hint{position:absolute;left:36px;top:30px;font:700 22px var(--f-latin);color:var(--muted)}
.ticket{border:1.5px dashed var(--muted);border-radius:10px;padding:10px 14px;margin:12px 0;background:rgba(255,255,255,.5)}
.ticket .leg{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ticket .leg b{font:700 22px var(--f-latin)}
.ticket .count{font:700 16px var(--f-hand);color:var(--beni)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(30,24,20,.82);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay-card{background:var(--paper);color:var(--ink);border-radius:10px;max-width:min(920px,100%);max-height:100%;overflow:auto;padding:18px;box-sizing:border-box;position:relative}
.overlay-card .art{width:100%;height:auto;display:block;min-width:min(640px,100%)}
.overlay .close{position:sticky;top:0;float:right;margin:-6px -6px 0 0;background:var(--paper);border:1.5px solid var(--muted);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--ink)}
.toc-overlay .toc-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 18px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 22px var(--f-latin);color:var(--on-desk-muted)}
#measure{position:absolute;left:-99999px;top:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){.leaf{display:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wc1" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.4"/></filter>
<filter id="wc2" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.2"/></filter>
<filter id="wc3" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="21" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.6"/></filter>
</defs></svg>

<div class="app">
  <header class="topbar">
    <div class="brand">東京・湘南旅行帖<small>Vol.1 冬</small></div>
    <div class="tb-actions">
      <button class="btn" id="btn-toc" type="button">目錄</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <div class="book" id="book"></div>
    <div class="loading" id="loading">翻開手帳中…</div>
  </div>
  <footer class="bottombar">
    <button class="navbtn" id="prev" type="button" aria-label="上一頁">‹</button>
    <input id="slider" type="range" min="0" max="0" value="0" aria-label="頁碼">
    <span id="pagelabel">封面</span>
    <button class="navbtn" id="next" type="button" aria-label="下一頁">›</button>
  </footer>
</div>
<div id="measure"></div>
<div class="overlay toc-overlay" id="toc-overlay" hidden><div class="overlay-card"><button class="close" type="button" aria-label="關閉">×</button><h2 style="margin:0 0 8px;font-size:24px">目錄</h2><div class="toc-grid" id="toc-list"></div></div></div>

<h2>這趟情侶必做 TOP 15</h2>
<p>綜合中文（Dcard／PTT／FB 社團／Threads／部落格）、日文與英文社群的出現頻率，加上「年末年始才有」的加分：</p>
<ol>
<li><strong>Shibuya Sky 夕陽轉夜景</strong>：社群聲量第一的展望台，預約 15:30～16:00 入場，夕陽和夜景一次看完</li>
<li><strong>淺草穿和服</strong>拍雷門、仲見世通，再到隅田川邊拍晴空塔</li>
<li><strong>鎌倉高校前「灌籃高手平交道」</strong>：江之電經過的瞬間</li>
<li><strong>七里濱夕陽＋富士山剪影</strong>：冬天空氣乾淨，是看到富士山機率最高的季節</li>
<li><strong>江之島「湘南の宝石」燈飾</strong>：日本三大燈飾之一，12/1 起點燈</li>
<li><strong>龍戀之鐘</strong>：兩人一起敲鐘、在柵欄掛愛情鎖</li>
<li><strong>teamLab Planets／Borderless</strong>：拍照效果最好的沉浸式展覽</li>
<li><strong>東京鐵塔跨年</strong>：增上寺除夜之鐘＋鐵塔倒數燈光</li>
<li><strong>初詣</strong>：淺草寺或明治神宮，一起抽籤、買御守（情侶可買「縁結び」御守）</li>
<li><strong>澀谷 PARCO 6F</strong>：任天堂、寶可夢、JUMP、卡普空，動漫迷一次逛完</li>
<li><strong>阿美橫町年末市集</strong>：12/28～12/31 才有的年貨叫賣氣氛</li>
<li><strong>燒肉／和牛壽喜燒約會晚餐</strong>：一晚預算拉高吃好的</li>
<li><strong>福袋</strong>：1/1～1/2 初賣，跟日本人一起排隊開福袋</li>
<li><strong>丸之內聖誕燈飾</strong>：抵達當晚就能看到，香檳金色的行道樹</li>
<li><strong>麻布台之丘／六本木 Tokyo City View</strong>：能把東京鐵塔拍得最漂亮的高樓</li>
</ol>

<p><strong>實際怎麼做</strong>
1. 結帳時出示護照（或 VJW 的免稅 QR），店家登錄免稅資料，你先付含稅金額
2. 1/2 在成田 T2 出境時，到海關的免稅確認處（或電子機台）掃護照，<strong>商品要放隨身行李或托運前先給海關看</strong>
3. 稅金依各店的退款方式退回（多為退回信用卡，部分店家收手續費；唐吉訶德等 PPIH 集團宣布免收退款手續費）</p>
<p><span class="stamp" title="出發前再確認">確認</span> 新制剛上路，1/2 出境時排隊時間可能比較久 → 這也是要提早到機場的原因。各店退款方式不同，結帳時問清楚並<strong>保留收據</strong>。</p>

<h2>付款：Suica、信用卡、現金</h2>
<ul>
<li><strong>Suica／PASMO</strong>：搭車＋便利商店＋自動販賣機＋很多餐廳都能用</li>
<li>iPhone：Apple 錢包直接新增 Suica，用 Apple Pay 儲值（台灣發行的 Visa／Master／JCB 多數可用）</li>
<li>JR 東日本的「Welcome Suica Mobile」App（iPhone 專用）是給外國旅客的版本，免押金、效期 180 天</li>
<li>Android：多數台灣販售的 Android 手機不支援日本 FeliCa → 到成田 T2 買實體 <strong>Welcome Suica</strong></li>
<li><strong>信用卡</strong>：日本信用卡普及度已大幅提升，燒肉、百貨、藥妝都能刷；出發前找「日本消費回饋」高的卡（如各銀行的日本／海外加碼卡）</li>
<li><strong>現金</strong>：神社御守、小店、路邊攤、部分拉麵店（自動售票機只收現金）還是要用 → 建議兩人帶 <strong>5～6 萬日圓</strong>，不夠可用 7-Eleven ATM 跨國提款</li>
<li><strong>QR 付款</strong>：PayPay 需日本門號，不必特地準備；部分店家可用 Alipay+、街口、全支付等台灣電子支付（看店門口標示）</li>
</ul>

<ul>
<li>洋蔥式穿法：發熱衣＋毛衣／帽T＋<strong>防風大衣或羽絨外套</strong>，室內暖氣很強，外套要好脫</li>
<li>必帶：圍巾、手套、毛帽（跨年夜和初日出要在戶外站好幾個小時）、暖暖包（日本便利商店也有）、護唇膏、乳液（非常乾燥）</li>
<li>鞋子：一天會走 15,000～25,000 步，穿<strong>走過很多次的好走鞋</strong></li>
<li><strong>情侶拍照配色</strong>：冬天東京街景偏灰，社群推薦穿<strong>米白、駝色、酒紅、墨綠</strong>；和服體驗選紅、粉、藍搭配；江之島燈飾拍照穿淺色外套比較不會糊成一片</li>
<li>太陽 16:35 就下山，<strong>拍照要抓 14:00～16:30</strong>，夕陽景點 16:00 前到</li>
</ul>

<td>轉乘、末班車、月台號碼，比 Google 準</td>

<td>日本人評分，3.5 分以上就很好吃</td>

<td>叫車，跨年夜回飯店備用</td>
</tr>

<td>買 teamLab、Shibuya Sky、迪士尼等門票</td>
</tr>

<td>入境＋免稅 QR</td>
</tr>

<td>地震、海嘯警報（江之島在海邊，一定要裝）</td>
</tr>

<td>Google 翻譯／DeepL</td>
<td>拍照翻譯菜單</td>
</tr>
<tr>
<td>各店官方 LINE／X</td>
<td>很多店在 X（推特）公告當日售完、臨時休息</td>
</tr>
</tbody>
</table></div>
<h2>行李清單</h2>
<ul>
<li><strong>證件類</strong>：護照、機票訂位紀錄、VJW QR 截圖、信用卡 2 張以上（分開放）、日圓現金、台灣駕照不用帶（日本不認台灣駕照，除非有日文譯本）</li>
<li><strong>電子類</strong>：手機、充電線、<strong>行動電源（只能放隨身行李，不能托運）</strong>、日本插座跟台灣一樣（A 型、100V）不用轉接頭</li>
<li><strong>衣物</strong>：見上方穿搭；飯店多有睡衣、牙刷（環保政策下部分飯店改成要去大廳拿）</li>
<li><strong>藥品</strong>：個人常備藥、感冒藥、腸胃藥、OK 繃、口罩</li>
<li><strong>其他</strong>：摺疊購物袋（日本塑膠袋要收費）、小毛巾（很多廁所沒擦手紙）、<strong>一個可摺疊的空行李袋</strong>（回程裝福袋和戰利品）</li>
</ul>
<h2>禁止／注意攜帶</h2>
<ul>
<li>肉類製品（肉乾、香腸、含肉泡麵）<strong>禁止帶入日本</strong>，罰款很重</li>
<li>回台灣時：日本的肉製品、新鮮水果也不能帶回台灣</li>
<li>液體：隨身行李每瓶 100ml 以內；在日本買的清酒、化妝水放托運</li>
<li>打火機每人限 1 個隨身，不能托運</li>
</ul>
<h2>保險與緊急狀況</h2>
<ul>
<li>旅平險＋<strong>不便險</strong>（航班延誤、行李延誤）＋<strong>海外突發疾病</strong>；日本醫療很貴</li>
<li>信用卡附加的保險通常只涵蓋刷卡購買的機票，條件要先看清楚</li>
<li>詳細緊急聯絡方式見<a href="#ch12" data-goto="ch12">第 12 章</a></li>
</ul></div></template>

</blockquote>
<h2>東京市區交通基本觀念</h2>
<ul>
<li><strong>JR 山手線</strong>：繞東京一圈的綠色環狀線，上野、秋葉原、東京、新宿、澀谷、原宿、池袋、<strong>大塚</strong>都在線上</li>
<li><strong>東京地鐵（Tokyo Metro，9 條線）＋都營地下鐵（4 條線）</strong>：兩家公司，轉乘時要出閘門再進，Suica 會自動算</li>
<li><strong>刷 Suica 就好</strong>：不用買單程票，進出站刷卡自動扣款</li>
</ul>
<h3>Tokyo Subway Ticket 划算嗎？</h3>
<div class="tw"><table>
<thead>
<tr>
<th>票種</th>
<th>價格（2026/3/14 起）</th>
</tr>
</thead>
<tbody>
<tr>
<td>24 小時</td>
<td>1,000 日圓</td>
</tr>
<tr>
<td>48 小時</td>
<td>1,500 日圓</td>
</tr>
<tr>
<td>72 小時</td>
<td>2,000 日圓</td>
</tr>
</tbody>
</table></div>
<ul>
<li><strong>只能搭東京地鐵＋都營地下鐵</strong>，JR（山手線）、百合海鷗線、私鐵都不能用</li>
<li>從<strong>第一次進站</strong>開始算時間，不是用日曆天</li>
<li>地鐵單程約 180～330 日圓，一天搭 4 次以上才划算</li>
<li><strong>建議</strong>：這趟很多段要搭 JR（上野 ↔ 秋葉原、新宿、澀谷）和私鐵（鎌倉、江之島），<strong>直接刷 Suica 最省心</strong>。12/30～12/31 地鐵為主的日子（銀座、麻布台、淺草）可以考慮買 48 小時券</li>
</ul>
<h2>鎌倉・江之島交通</h2>
<h3>從上野去鎌倉</h3>
<ul>
<li><strong>JR</strong>：上野 →（上野東京線）→ 東京 →（橫須賀線）→ 鎌倉，約 70～80 分，約 1,200 日圓</li>
<li>或上野 → 品川轉橫須賀線</li>
<li>想先去北鎌倉（圓覺寺、明月院）就在<strong>北鎌倉站</strong>下車，走到鶴岡八幡宮約 20～25 分</li>
</ul>
<h3>江之島 → 回東京</h3>
<ul>
<li><strong>小田急浪漫特快（Romancecar）</strong>：片瀨江之島 → 新宿，約 70 分，車票＋特急券約 1,800 日圓 <span class="stamp" title="出發前再確認">確認</span>（週末熱門車次要先訂位，小田急官網可訂）</li>
<li>或小田急快速急行：約 80 分、約 700 日圓，不用訂位</li>
</ul>
<h3>票券比較</h3>
<div class="tw"><table>
<thead>
<tr>
<th>票券</th>
<th>內容</th>
<th>價格（參考）</th>
<th>適合誰</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>江之電一日券「のりおりくん」</strong></td>
<td>江之電全線一日無限搭</td>
<td>大人 800 日圓 <span class="stamp" title="出發前再確認">確認</span></td>
<td>江之電上下車 3 次以上（鎌倉 → 長谷 → 鎌倉高校前 → 七里濱 → 江之島）</td>
</tr>
<tr>
<td>小田急「江之島・鎌倉周遊券」</td>
<td>新宿 ↔ 藤澤來回＋藤澤～片瀨江之島＋江之電全線</td>
<td>新宿出發約 1,640 日圓 <span class="stamp" title="出發前再確認">確認</span></td>
<td>從新宿出發、當天來回。<strong>我們從上野出發、去程走 JR，比較不划算</strong></td>
</tr>
<tr>
<td>江之島島內設施套票（Enoshima Island Pass）</td>
<td>Sea Candle、岩屋洞窟、Samuel Cocking 苑等</td>
<td>約 1,550 日圓 <span class="stamp" title="出發前再確認">確認</span></td>
<td>島上設施要全玩</td>
</tr>
</tbody>
</table></div>
<p><strong>我們的建議組合（12/28～12/29）</strong>
1. 12/28：Suica 搭 JR 上野 → 北鎌倉／鎌倉，在鎌倉站買 <strong>のりおりくん</strong>，江之電玩一整天，晚上住江之島
2. 12/29：江之島 → 小田急浪漫特快（或快速急行）→ 新宿，Suica 直接刷</p>
<h3>江之電的小撇步</h3>
<ul>
<li>鎌倉 → 長谷 → 極樂寺 → 稻村崎 → <strong>鎌倉高校前</strong> → <strong>七里濱</strong> → 腰越 → 江之島，全程約 25 分</li>
<li>往江之島方向<strong>坐右側／站右側</strong>看得到海</li>
<li>週末、假日鎌倉站上車可能要排隊 20～30 分，<strong>早上 9:30 前</strong>或平日比較順</li>
</ul>
<h2>跨年夜與元旦交通 <span class="stamp" title="出發前再確認">確認</span></h2>
<ul>
<li>近年 JR 東日本<strong>不再整夜行駛山手線</strong>；東京地鐵、都營是否加開末班車每年不同，<strong>12 月中下旬</strong>各公司才公告 → 12/31 當天用乗換案内查末班車</li>
<li>增上寺／東京鐵塔回上野：</li>
<li>地鐵：御成門站（都營三田線）或大門站（都營淺草線、大江戶線）→ 上野，約 20～25 分（要看當晚有沒有延長營運）</li>
<li>計程車：約 7 公里，深夜加成（22:00～5:00 約 +20%）後約 4,000～5,000 日圓，<strong>用 GO App 叫車</strong>；跨年後一小時很難叫，可以先走到日比谷、新橋一帶再叫</li>
<li>江之島初日出臨時車：2026 年元旦小田急<strong>沒有整夜行駛</strong>，改開早上 4:50 新宿發的臨時特急「New Year Express」（6:13 到片瀨江之島）＋清晨臨時各站停車。2027 年版會在 11 月底～12 月公告 <span class="stamp" title="出發前再確認">確認</span></li>
</ul>
<h2>主要轉乘站避坑</h2>
<ul>
<li><strong>新宿站</strong>：世界最多人的車站，出口超過 200 個 → 先在 Google Maps 查好要從「東口／西口／南口／新南口」哪個出口出去</li>
<li><strong>澀谷站</strong>：施工中，動線一直改 → 跟著「ハチ公口（八公口）」或「Shibuya Scramble Square」指標走</li>
<li><strong>東京站</strong>：JR 京葉線月台離其他月台很遠（走 10 分鐘以上），去迪士尼要預留時間</li>
<li><strong>上野站 vs 京成上野站</strong>：是<strong>兩個不同車站</strong>，走路約 3～5 分鐘，Skyliner 在京成上野</li>
</ul>
<h2>計程車</h2>
<ul>
<li>起跳約 500 日圓（約 1 公里），之後跳得很快；短程 2～3 公里約 1,000～1,500 日圓</li>
<li>2 人一起搭、拖行李、跨年深夜時很值得</li>
<li>車門是<strong>自動開關</strong>，不要自己去拉</li>
</ul></div></template>

<p><strong>東京住上野（7 晚，同一間飯店）＋ 江之島住 1 晚（12/28）</strong>
- 上野有 Skyliner 直達成田，<strong>12/25 晚上抵達、1/2 回程都最省力</strong>
- 走路就能到阿美橫町、上野公園；淺草、秋葉原、東京站都在 10 分鐘車程內；跨年夜去淺草寺初詣也近
- 大塚是很好的「安靜、平價、在地」替代方案，特別適合喜歡老街居酒屋和懷舊路面電車的人
- 去江之島那晚，大行李<strong>寄放在上野飯店</strong>，只帶一個過夜包</p>
</blockquote>

<h2>大塚：推薦飯店與區域特色</h2>
<p><strong>為什麼考慮大塚？</strong>
- JR 山手線大塚站：到池袋 1 站、新宿約 15 分、上野約 15 分
- 都電荒川線（東京櫻花路面電車）就在站前，一日券可以坐著復古路面電車到<strong>都電雜司谷（鬼子母神）、早稻田、王子、町屋</strong>散步
- 居酒屋、立飲、深夜拉麵密度很高，觀光客少，價格是東京市中心的 7～8 成
- 去成田：大塚 → 日暮里（山手線約 10 分）→ Skyliner</p>

<ul>
<li>《灌籃高手》動畫片頭的場景，海＋江之電＋平交道，<strong>全球動漫迷朝聖地</strong></li>
<li>江之電約每 12 分鐘一班，<strong>上行、下行都會經過</strong>，一小時有 10 次機會</li>
<li>拍照規則（現場有警衛）：<strong>不能站在車道或平交道上</strong>、不能擋住住戶出入、要在人行道上排隊拍；<strong>週末假日塞車會入鏡</strong></li>
<li>最佳拍攝：站在<strong>車站往鎌倉方向的坡道上</strong>往下拍，或在平交道旁的人行道側拍</li>
<li>鎌倉高校前站本身也是「最靠近海的車站」，月台直接看海</li>
</ul>

<h3>日本福袋基本知識</h3>
<ul>
<li>每年<strong>元旦或 1/2「初賣」</strong>時開賣，一個 3,000～30,000 日圓，內容價值通常是售價的 2～5 倍</li>
<li>近年許多品牌改成<strong>網路預購、抽籤、或公開內容</strong>（看得到裡面裝什麼）</li>
<li>近年<strong>元旦不營業的百貨越來越多</strong>，大型百貨多從 <strong>1/2 開始初賣</strong></li>
</ul>
<h3>1/1 vs 1/2 開賣（以往年傾向推估 <span class="stamp" title="出發前再確認">確認</span> 2027 年請查各店公告）</h3>

<h3>搶福袋實戰</h3>
<ol>
<li><strong>12 月中</strong>上各品牌日本官網、IG、X 查「福袋 2027」「初売り」公告</li>
<li>熱門品牌（像化妝品、高單價名牌）<strong>開門前 1～2 小時</strong>就會排隊，冷到要帶暖暖包</li>
<li>現場會有隊伍號碼牌，聽工作人員指示</li>
<li>買完別急著拆，回飯店拆比較有儀式感，也方便拍開箱影片</li>
<li>回程要預留行李空間（摺疊旅行袋！）</li>
<li>新制退稅：福袋也能辦免稅，記得出示護照</li>
</ol>
<h3>我們的建議</h3>
<ul>
<li><strong>1/1</strong>：電器量販、唐吉訶德、有開門的商場隨意逛</li>
<li><strong>1/2 早上（回國日）</strong>：<strong>上野松坂屋</strong>或<strong>銀座三越</strong>（都在 Skyliner 沿線附近），10:00 開門前排隊 → 11:00 前買完 → 午餐 → 15:30 回飯店拿行李</li>
</ul>

<li>2026 年辦了 5 場（上午 3 場、下午 2 場），約 6 萬人參加</li>
<li>往年時間約 <strong>10:10、11:00、11:50（上午）、13:30、14:20（下午）</strong> <span class="stamp" title="出發前再確認">確認</span> 2027 年請查宮內廳公告</li>
<li>從<strong>皇居正門（二重橋）</strong>入場，要經過<strong>安檢</strong>（不能帶大包包、危險物品），提早 1～2 小時排</li>

<h2>拍照小技巧</h2>
<ul>
<li><strong>冬天太陽 16:35 下山</strong>，好光線在 14:00～16:30；夕陽景點 16:00 前到</li>
<li>「藍調時刻」（日落後 15～25 分鐘）天空是深藍色，夜景最漂亮</li>
<li>展望台玻璃反光：<strong>鏡頭貼緊玻璃</strong>、穿深色衣服、或用手掌圍住鏡頭</li>
<li>情侶照姿勢：牽手背影走路、互看、她坐他站、一起看遠方、自拍棒＋0.5x 廣角</li>
<li>請陌生人幫拍：日本人通常很樂意，說「すみません、写真をお願いできますか？」</li>
<li><strong>和服照</strong>：腰帶不要彎腰太多、走路小步、手放前面</li>
</ul>

<h2>三套一日約會範本</h2>
<h3>A. 經典東京（第一次來必走）</h3>
<p>淺草和服散步 → 仲見世通吃點心 → 人力車 → 隅田川步道 → 晴空塔夕陽 → Solamachi 晚餐</p>
<h3>B. 夜景浪漫</h3>
<p>六本木之丘森美術館 → 麻布台之丘散步 → teamLab Borderless → 芝公園拍東京鐵塔 → Tokyo City View 夜景 → 高樓酒吧小酌</p>
<h3>C. 文青慢活</h3>
<p>清澄白河 Blue Bottle → 谷中銀座散步 → 根津神社鳥居 → 上野不忍池 → 下北澤古著 → 下北澤小酒館晚餐</p>
<p>（12/27 Shibuya Sky 那天則是：明治神宮 → 原宿 → 表參道 → 澀谷 PARCO → <strong>Shibuya Sky 夕陽</strong> → 宮下公園澀谷橫丁晚餐）</p></div></template>

<h2>社群常見踩雷 <span class="stamp" title="出發前再確認">確認</span></h2>
<h3>排隊與名店</h3>
<ul>
<li>「網紅店排 2 小時、吃 20 分鐘」是常態 → <strong>一天最多排一間</strong>，其他吃不用排的好店</li>
<li>用 Google Maps 看「熱門時段」圖表，避開尖峰</li>
<li>很多拉麵店<strong>售完就關</strong>，下午去常撲空</li>
</ul>
<h3>觀光陷阱</h3>
<ul>
<li>新宿歌舞伎町、澀谷、六本木<strong>路邊拉客的酒吧、居酒屋</strong>：可能收天價，<strong>不要跟著走</strong></li>
<li>黃金街酒吧：先問座位費（チャージ）</li>
<li>淺草仲見世通部分商品比外面貴，伴手禮可以在百貨、車站買</li>
</ul>
<h3>交通</h3>
<ul>
<li>上野站 ≠ 京成上野站</li>
<li>末班車約 0:00～0:30，錯過只能搭計程車（深夜加成）</li>
<li>江之電週末鎌倉站排隊很久</li>
<li>電車上<strong>不講電話</strong>、講話小聲、後背包背在前面</li>
</ul>
<h3>年末年始</h3>
<ul>
<li>以為百貨 1/1 有開 → <strong>幾乎都沒開</strong></li>
<li>以為 12/31 晚上能隨便找到餐廳 → <strong>要訂位</strong></li>
<li>以為可以在澀谷跨年 → <strong>活動停辦＋管制</strong></li>
<li>以為小店都有開 → <strong>12/29～1/3 很多休</strong>，看 Google Maps 營業時間＋店家社群</li>
</ul>

<script>
(function(){
  "use strict";
  var book=document.getElementById("book"), stage=document.getElementById("stage"), measure=document.getElementById("measure");
  var slider=document.getElementById("slider"), label=document.getElementById("pagelabel");
  var prevBtn=document.getElementById("prev"), nextBtn=document.getElementById("next");
  var chapterTpls=[].slice.call(document.querySelectorAll("template.chapter"));
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pages=[], chapterStart={}, mode=null, geom=null, idx=0, busy=null;

  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
  function sticker(ch){var t=document.querySelector('template[data-sticker="'+ch+'"]');return t?t.innerHTML:"";}

  // ---------- geometry
  function pickMode(){
    var w=stage.clientWidth, h=stage.clientHeight;
    var spread = w>=860 && w/h>1.15;
    if(spread){return {mode:"spread",pw:520,ph:740};}
    var pw=400, ph=Math.round(Math.min(860,Math.max(600,pw*h/Math.max(w,1))));
    return {mode:"single",pw:pw,ph:ph};
  }
  function applyScale(){
    var w=stage.clientWidth-8, h=stage.clientHeight-8;
    var bw=geom.pw*(mode==="spread"?2:1), s=Math.min(w/bw,h/geom.ph);
    book.style.transform="scale("+s+")";
  }

  // ---------- page factories
  function basePage(cls,washi){
    var p=el("div","page "+(cls||""));
    if(washi)p.setAttribute("data-washi",washi);
    return p;
  }
  function flowPage(ch){
    var p=basePage("flow-page",ch.washi);
    p.innerHTML='<div class="runhead">'+sticker(ch.num)+'<span>TK'+ch.num+'</span><span class="rh-ch">'+ch.short+'</span></div>'+
      '<div class="inner"><div class="flow"></div></div><div class="folio"></div>';
    p.dataset.ch=ch.num;
    return p;
  }
  function coverPage(){
    var p=basePage("cover");
    p.innerHTML=document.getElementById("cover-src").innerHTML+
      '<div class="cover-title"><div class="kicker">Tokyo · Kamakura · Enoshima</div><h1>東京・湘南<br>旅行帖</h1>'+
      '<div class="sub">2026.12.25 – 2027.1.2　ふたり旅 9 日間</div></div>'+
      '<div class="cover-issue"><b>Vol.1</b><span>冬・年末年始號</span></div>';
    return p;
  }
  function introPage(){
    var p=basePage("intro-page","sora");
    var start=new Date("2026-12-25T15:00:00+08:00"), now=new Date(), d=Math.ceil((start-now)/864e5);
    var count=d>0?"距離出發還有 "+d+" 天":"旅途中，玩得開心！";
    p.innerHTML='<div class="inner"><h2>這本手帳怎麼用</h2>'+
      '<div class="ticket"><div class="count">'+count+'</div>'+
      '<div class="leg"><span>去程 JX804　12/25（五）</span><b>15:00 TPE → 19:00 NRT T2</b></div>'+
      '<div class="leg"><span>回程 JX805　1/2（六）</span><b>20:10 NRT T2 → 23:20 TPE</b></div></div>'+
      '<ul><li>電腦：點書頁右半邊、按 → 鍵或滾輪往下翻；左半邊、← 鍵往回翻</li><li>手機：左右滑動翻頁</li>'+
      '<li>下方滑桿可以快速跳頁，右上「目錄」直接跳到章節</li><li>手繪圖點一下可以放大看</li></ul>'+
      '<p>看到 <span class="stamp">確認</span> 的資訊，是年末年始可能變動的項目，出發前一週請再查一次官網。</p>'+
      '<blockquote><p>內容綜合 Dcard、PTT、Threads、FB 社團、部落格，以及日文、英文旅遊網站與官方公告整理。整理日期 2026/10/31。</p></blockquote></div>'+
      '<div class="folio"></div>';
    return p;
  }
  function tocPage(){
    var p=basePage("toc-page","yuzu");
    p.innerHTML='<div class="inner"><h2>目錄 Contents</h2><div class="toc-grid" data-toc></div></div><div class="folio"></div>';
    return p;
  }
  function memoPage(){
    var p=basePage("memo-page");
    p.innerHTML='<div class="hint">memo ✎</div><div class="grid"></div><div class="folio"></div>';
    return p;
  }
  function creditsPage(){
    var p=basePage("credits-page","matcha");
    p.innerHTML='<div class="inner"><h2>照片來源與授權</h2><ul class="credits" style="font-size:11.5px;line-height:1.5">'+
      document.getElementById("credits-src").innerHTML+'</ul><p style="font-size:13px">手繪插圖與整理圖為本手帳原創。照片依各自授權條款使用。</p></div><div class="folio"></div>';
    return p;
  }
  function backPage(){
    var p=basePage("back-page");
    p.innerHTML='<div class="inner" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px">'+
      sticker("06").replace(/width="30" height="30"/,'width="120" height="120"')+
      '<div style="font:700 34px var(--f-latin)">よいお年を！</div><div style="font-size:18px">祝我們有個美好的新年 ♡</div>'+
      '<div style="font:600 16px var(--f-latin);color:var(--muted)">Tokyo · Kamakura · Enoshima 2026–2027</div></div>';
    return p;
  }
  function openerLeft(ch){
    var p=basePage("opener-left",ch.washi);
    p.innerHTML='<div class="opener-hero">'+ch.hero+'<div class="bignum">'+ch.num+'</div></div>';
    if(!ch.hero){p.querySelector(".opener-hero").insertAdjacentHTML("afterbegin",'<figure class="hero pending"><div class="ph">'+ch.stickerBig+'</div></figure>');}
    p.dataset.ch=ch.num;
    return p;
  }
  function openerRight(ch){
    var p=basePage("opener",ch.washi);
    p.innerHTML='<div class="inner"><div class="stk">'+ch.stickerBig+'</div><div class="chlabel">Chapter '+ch.num+'</div><h1>'+ch.title+'</h1>'+
      '<p class="romaji">'+ch.romaji+'</p>'+ch.lead+'<ul class="contents" data-contents="'+ch.num+'"></ul></div><div class="folio"></div>';
    p.dataset.ch=ch.num;
    return p;
  }

  // ---------- pagination
  function fits(flow){return flow.scrollHeight<=flow.clientHeight+1;}
  function splitTable(tw,flow,newPage){
    var table=tw.querySelector("table"), rows=[].slice.call(table.tBodies[0].rows);
    var head=table.tHead?table.tHead.outerHTML:"";
    var cap=table.caption?table.caption.outerHTML:"";
    var part=el("div","tw"), t=el("table",table.className); t.innerHTML=cap+head+"<tbody></tbody>"; part.appendChild(t); flow.appendChild(part);
    var i=0;
    while(i<rows.length){t.tBodies[0].appendChild(rows[i]);if(!fits(flow)){t.tBodies[0].removeChild(rows[i]);break;}i++;}
    if(i===0){flow.removeChild(part);}
    if(i<rows.length){
      var rest=el("div","tw"), t2=el("table","cont"); t2.innerHTML="<caption>（續）</caption>"+head+"<tbody></tbody>";
      rows.slice(i).forEach(function(r){t2.tBodies[0].appendChild(r);}); rest.appendChild(t2);
      return rest;
    }
    return null;
  }
  function splitList(list,flow){
    var items=[].slice.call(list.children), part=list.cloneNode(false); flow.appendChild(part);
    var i=0;
    while(i<items.length){part.appendChild(items[i]);if(!fits(flow)){part.removeChild(items[i]);break;}i++;}
    if(i===0){flow.removeChild(part);}
    if(i<items.length){
      var rest=list.cloneNode(false);
      if(list.tagName==="OL"){rest.setAttribute("start",(parseInt(list.getAttribute("start")||"1",10)+i));}
      items.slice(i).forEach(function(li){rest.appendChild(li);}); return rest;
    }
    return null;
  }
  function isHeading(n){return n&&/^H[23]$/.test(n.tagName);}

  function layoutChapter(ch,out){
    var src=ch.tpl.content.querySelector(".flowsrc").cloneNode(true);
    var blocks=[].slice.call(src.children);
    var page=flowPage(ch), flow=page.querySelector(".flow");
    measure.appendChild(page);
    function newPage(){
      measure.removeChild(page); out.push(page); page=flowPage(ch); flow=page.querySelector(".flow"); measure.appendChild(page);
    }
    var queue=blocks.slice();
    var guard=0;
    while(queue.length&&guard++<5000){
      var b=queue.shift();
      flow.appendChild(b);
      if(fits(flow))continue;
      flow.removeChild(b);
      var rest=null, empty=!flow.children.length, before=flow.children.length, split=false;
      if(b.classList&&b.classList.contains("tw")){rest=splitTable(b,flow);split=true;}
      else if(b.tagName==="UL"||b.tagName==="OL"){rest=splitList(b,flow);split=true;}
      if(rest){queue.unshift(rest);newPage();continue;}
      if(split&&flow.children.length>before)continue; // every row or item found room
      if(empty){flow.appendChild(b);continue;} // taller than a page: let it clip rather than loop
      // A picture may shrink to use the space left on this page when that space is generous.
      var media=b.querySelector&&b.querySelector("svg.art, img");
      if(media){
        var used=flow.lastElementChild?flow.lastElementChild.offsetTop+flow.lastElementChild.offsetHeight:0;
        var room=flow.clientHeight-used-(b.tagName==="FIGURE"&&b.classList.contains("photo")?70:30);
        var natural=flow.clientHeight*0.42;
        if(media.tagName.toLowerCase()==="svg"){var vb=media.viewBox.baseVal;natural=Math.min(flow.clientWidth*vb.height/vb.width,flow.clientHeight*0.9);}
        if(room>=natural*0.82){media.style.maxHeight=room+"px";flow.appendChild(b);if(fits(flow))continue;flow.removeChild(b);media.style.maxHeight="";}
      }
      // keep headings with what follows them, unless the page holds nothing else
      var carry=[];
      while(isHeading(flow.lastElementChild)){carry.unshift(flow.lastElementChild);flow.removeChild(flow.lastElementChild);}
      if(!flow.children.length){
        carry.forEach(function(c){flow.appendChild(c);});
        if(media){var used2=flow.lastElementChild.offsetTop+flow.lastElementChild.offsetHeight;media.style.maxHeight=(flow.clientHeight-used2-60)+"px";}
        flow.appendChild(b);continue;
      }
      newPage();
      carry.forEach(function(c){flow.appendChild(c);});
      queue.unshift(b);
    }
    measure.removeChild(page); out.push(page);
  }

  function loadChapters(){
    return chapterTpls.map(function(tpl){
      var m=tpl.content.querySelector(".meta");
      return {tpl:tpl,num:tpl.dataset.ch,short:tpl.dataset.short,washi:tpl.dataset.washi,
        title:m.querySelector("h1").innerHTML,romaji:m.querySelector(".romaji").innerHTML,
        lead:m.querySelector(".lead").innerHTML,hero:m.querySelector(".hero-src").innerHTML,
        stickerBig:m.querySelector(".sticker-src").innerHTML};
    });
  }

  function paginate(){
    measure.innerHTML="";
    measure.style.setProperty("--pw",geom.pw+"px");measure.style.setProperty("--ph",geom.ph+"px");
    measure.style.setProperty("--flowh",(geom.ph-74)+"px");
    var out=[coverPage(),introPage(),tocPage()];
    chapterStart={};
    var chs=loadChapters();
    chs.forEach(function(ch){
      if(mode==="spread"&&out.length%2===0){var m=memoPage();out.push(m);}
      chapterStart[ch.num]=out.length;
      out.push(openerLeft(ch));out.push(openerRight(ch));
      layoutChapter(ch,out);
    });
    out.push(creditsPage());
    if(mode==="spread"&&out.length%2===0){out.push(memoPage());}
    out.push(backPage());
    out.forEach(function(p,i){
      p.dataset.index=i;
      var f=p.querySelector(".folio"); if(f&&i>0)f.textContent="— "+i+" —";
    });
    // section page numbers for chapter openers and the table of contents
    chs.forEach(function(ch){
      var ul=out[chapterStart[ch.num]+1].querySelector("[data-contents]"), html="";
      out.forEach(function(p,i){
        if(p.dataset.ch!==ch.num)return;
        p.querySelectorAll(".flow > h2").forEach(function(h){
          html+='<li><a href="#p'+i+'" data-page="'+i+'"><span>'+h.textContent+'</span><span class="dots"></span><span class="pn">'+i+'</span></a></li>';
        });
      });
      ul.innerHTML=html;
    });
    var tocHtml=chs.map(function(ch){
      return '<a class="toc-row" href="#p'+chapterStart[ch.num]+'" data-page="'+chapterStart[ch.num]+'">'+sticker(ch.num)+
        '<span class="t">'+ch.num+'　'+ch.title+'</span><span class="r">'+ch.romaji+'</span><span class="pn">'+chapterStart[ch.num]+'</span></a>';
    }).join("");
    out[2].querySelector("[data-toc]").innerHTML=tocHtml;
    document.getElementById("toc-list").innerHTML=tocHtml;
    pages=out;
    slider.max=pages.length-1;
  }

  // ---------- rendering & flipping
  function normalize(i){
    i=Math.max(0,Math.min(pages.length-1,i|0));
    if(mode==="spread"&&i>0&&i%2===0)i-=1;
    return i;
  }
  function visible(i){return mode==="spread"?(i===0?[null,pages[0]]:[pages[i],pages[i+1]||null]):[pages[i]];}
  function slotFor(page,side){
    var s=el("div","slot "+(side||""));
    if(page){s.appendChild(page.cloneNode(true));}else{s.classList.add("empty");}
    return s;
  }
  function render(){
    book.innerHTML="";
    book.classList.toggle("single",mode==="single");
    book.style.setProperty("--pw",geom.pw+"px");book.style.setProperty("--ph",geom.ph+"px");
    book.style.setProperty("--flowh",(geom.ph-74)+"px");
    var v=visible(idx);
    if(mode==="spread"){book.appendChild(slotFor(v[0],"left"));book.appendChild(slotFor(v[1],"right"));}
    else{book.appendChild(slotFor(v[0],""));}
    slider.value=idx;
    label.textContent=idx===0?"封面":(mode==="spread"&&pages[idx+1]?idx+"–"+(idx+1):String(idx))+" / "+(pages.length-1);
    prevBtn.disabled=idx===0; nextBtn.disabled=nextIndex(idx)===idx;
    try{history.replaceState(null,"","#p"+idx);}catch(e){location.hash="p"+idx;}
  }
  function nextIndex(i){
    if(mode==="spread"){var n=i===0?1:i+2;return n<pages.length?n:i;}
    return i+1<pages.length?i+1:i;
  }
  function prevIndex(i){
    if(mode==="spread"){return i<=1?0:i-2;}
    return i>0?i-1:0;
  }
  function makeLeaf(front,back,side){
    var leaf=el("div","leaf");
    var f=el("div","face front"),bk=el("div","face back");
    if(front)f.appendChild(front.cloneNode(true)); else f.appendChild(basePage("blank"));
    if(back)bk.appendChild(back.cloneNode(true)); else bk.appendChild(basePage("blank"));
    f.appendChild(el("div","shade"));bk.appendChild(el("div","shade"));
    leaf.appendChild(f);leaf.appendChild(bk);
    leaf.style.left=side==="right"?geom.pw+"px":"0px";
    leaf.style.transformOrigin=side==="right"?"left center":"right center";
    return leaf;
  }
  function flipTo(target){
    target=normalize(target);
    if(busy){busy.finish();}
    if(target===idx)return;
    var forward=target>idx, adjacent=forward?target===nextIndex(idx):target===prevIndex(idx);
    if(reduce||!adjacent){idx=target;render();return;}
    var cur=visible(idx), nxt=visible(target), leaf, kf;
    if(mode==="spread"){
      if(forward){
        // right page lifts and lands on the left
        book.children[1].replaceWith(slotFor(nxt[1],"right"));
        leaf=makeLeaf(cur[1],nxt[0],"right");
        kf=[{transform:"rotateY(0deg)"},{transform:"rotateY(-180deg)"}];
      }else{
        book.children[0].replaceWith(slotFor(nxt[0],"left"));
        if(!nxt[0])book.children[0].classList.add("empty");
        leaf=makeLeaf(cur[0],nxt[1],"left");
        kf=[{transform:"rotateY(0deg)"},{transform:"rotateY(180deg)"}];
      }
    }else{
      if(forward){
        book.innerHTML="";book.appendChild(slotFor(nxt[0],""));
        leaf=makeLeaf(cur[0],null,"right");leaf.style.left="0px";leaf.style.transformOrigin="left center";
        kf=[{transform:"rotateY(0deg)",opacity:1},{transform:"rotateY(-100deg)",opacity:.4}];
      }else{
        leaf=makeLeaf(nxt[0],null,"right");leaf.style.left="0px";leaf.style.transformOrigin="left center";
        kf=[{transform:"rotateY(-100deg)",opacity:.4},{transform:"rotateY(0deg)",opacity:1}];
      }
    }
    book.appendChild(leaf);
    var shades=leaf.querySelectorAll(".shade");
    shades.forEach(function(s){s.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:650,easing:"ease-in-out"});});
    var anim=leaf.animate(kf,{duration:650,easing:"cubic-bezier(.35,.05,.2,1)"});
    busy=anim;
    var done=function(){if(busy===anim){busy=null;}idx=target;render();};
    anim.onfinish=done; anim.oncancel=done;
  }
  function go(i){flipTo(i);}
  function next(){go(nextIndex(idx));}
  function prev(){go(prevIndex(idx));}

  // ---------- input
  prevBtn.addEventListener("click",prev); nextBtn.addEventListener("click",next);
  slider.addEventListener("input",function(){idx=normalize(+slider.value);render();});
  document.addEventListener("keydown",function(e){
    if(!document.getElementById("zoom-overlay").hidden||!document.getElementById("toc-overlay").hidden){if(e.key==="Escape")closeOverlays();return;}
    if(e.target&&e.target.tagName==="INPUT"&&e.target.type!=="range")return;
    if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();next();}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev();}
    else if(e.key==="Home"){go(0);}else if(e.key==="End"){go(pages.length-1);}
  });
  var wheelLock=0;
  stage.addEventListener("wheel",function(e){
    var now=Date.now(); if(now<wheelLock||Math.abs(e.deltaY)<20)return;
    wheelLock=now+700; if(e.deltaY>0)next();else prev();
  },{passive:true});
  var down=null;
  stage.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY,t:Date.now()};});
  stage.addEventListener("pointerup",function(e){
    if(!down)return; var dx=e.clientX-down.x, dy=e.clientY-down.y, d=down; down=null;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){if(dx<0)next();else prev();return;}
    if(Math.abs(dx)>8||Math.abs(dy)>8||Date.now()-d.t>500)return;
    var target=e.target;
    var link=target.closest&&target.closest("[data-page],[data-goto],a");
    if(link&&book.contains(link)){
      e.preventDefault();
      if(link.dataset.page){go(+link.dataset.page);}
      else if(link.dataset.goto){go(chapterStart[link.dataset.goto.slice(2)]||0);}
      else if(link.href){window.open(link.href,"_blank","noopener");}
      return;
    }
    var fig=target.closest&&target.closest(".artfig");
    if(fig&&book.contains(fig)){openZoom(fig.innerHTML);return;}
    var r=book.getBoundingClientRect();
    if(e.clientX>r.left+r.width/2)next();else prev();
  });
  book.addEventListener("click",function(e){if(e.target.closest("a"))e.preventDefault();});

  function openZoom(html){document.getElementById("zoom-body").innerHTML=html;document.getElementById("zoom-overlay").hidden=false;}
  function closeOverlays(){document.getElementById("zoom-overlay").hidden=true;document.getElementById("toc-overlay").hidden=true;}
  document.querySelectorAll(".overlay").forEach(function(o){
    o.addEventListener("click",function(e){
      var link=e.target.closest("[data-page]");
      if(link){e.preventDefault();closeOverlays();idx=normalize(+link.dataset.page);render();return;}
      if(e.target===o||e.target.closest(".close"))closeOverlays();
    });
  });
  document.getElementById("btn-toc").addEventListener("click",function(){document.getElementById("toc-overlay").hidden=false;});

  // ---------- boot
  // Lay out for the current screen. keepCh: chapter to stay in after a layout change.
  function setup(keepCh){
    geom=pickMode(); mode=geom.mode;
    paginate();
    var fromHash=/^#p(\d+)$/.exec(location.hash);
    if(keepCh&&chapterStart[keepCh]!=null){idx=normalize(chapterStart[keepCh]);}
    else if(fromHash){idx=normalize(+fromHash[1]);}
    else{idx=0;}
    render();
    applyScale();
  }
  var resizeT;
  window.addEventListener("resize",function(){clearTimeout(resizeT);resizeT=setTimeout(function(){
    var g=pickMode();
    if(g.mode!==mode||(g.mode==="single"&&g.ph!==geom.ph)){setup(pages[idx]&&pages[idx].dataset.ch);}
    else{applyScale();}
  },200);});

  var allText=chapterTpls.map(function(t){return t.content.textContent;}).join("").replace(/\s+/g,"");
  var uniq=Array.from(new Set(allText)).join("")+"東京湘南旅行帖目錄這本手帳怎麼用照片來源與授權";
  var faces=['400 16px "LXGW WenKai TC"','700 16px "LXGW WenKai TC"','400 13px "Noto Sans TC"','700 13px "Noto Sans TC"',
    '500 16px "Caveat"','600 16px "Caveat"','700 16px "Caveat"'];
  var fontLoads=faces.map(function(f){return document.fonts?document.fonts.load(f,uniq).catch(function(){}):Promise.resolve();});
  var timeout=new Promise(function(r){setTimeout(r,6000);});
  Promise.race([Promise.all(fontLoads),timeout]).catch(function(){}).then(function(){
    document.getElementById("loading").remove();
    setup();
  });
})();
</script>

</body></html>
